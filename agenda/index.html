<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="מתכנן יום בעברית: קו זמן, שבוע, משימות חוזרות, תזכורות וסנכרון בין מכשירים.">
<meta name="theme-color" content="#0a0a0d">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סדר יום">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>סדר יום</title>
<style>
:root{
  --bg:#0a0a0d; --s1:#131318; --s2:#1b1b22; --s3:#26262f;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --tx:#f4f4f7; --mut:#8c8c99; --mut2:#82828f;
  --ok:#3ddc97; --danger:#ff6b6b;
  --hh:72px;           /* גובה שעה בתצוגה יומית */
  --whh:46px;          /* גובה שעה בתצוגה שבועית */
  --gut:46px;          /* רוחב עמודת השעות */
  --ease:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);
  font:400 16px/1.45 system-ui,-apple-system,"Segoe UI","Heebo","Assistant",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;min-height:100dvh;position:relative}

/* ───────── כותרת עליונה (חומר שקוף) ───────── */
.top{position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 10px) 16px 0;
  background:rgba(10,10,13,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.r1{display:flex;align-items:center;gap:2px}
.r1 .ib{width:44px;height:44px}
.ttl{min-width:0}
#h2t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r1 .ttl{margin-inline-end:6px}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.ttl p{margin:2px 0 0;color:var(--mut);font-size:13.5px;letter-spacing:.005em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prog{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--s3);color:var(--tx);font-variant-numeric:tabular-nums;transition:background .3s,color .3s}
.prog.full{background:rgba(61,220,151,.18);color:var(--ok)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut);transition:background .15s,color .15s,transform .1s}
.ib:hover{background:var(--s2);color:var(--tx)}
.ib:active{transform:scale(.92);background:var(--s3)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.seg{position:relative;display:flex;background:var(--s2);border-radius:11px;padding:2px;isolation:isolate}
.seg button{position:relative;z-index:1;min-width:64px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--mut);transition:color .2s}
.seg button[aria-selected=true]{color:var(--tx)}
.seg::before{content:"";position:absolute;z-index:0;top:2px;bottom:2px;inset-inline-start:2px;width:calc(50% - 2px);
  background:var(--s3);border-radius:9px;transition:transform .35s var(--ease)}
.seg[data-v=week]::before{transform:translateX(-100%)}
.todaybtn{padding:6px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--tx);transition:background .15s,opacity .2s}
.todaybtn:hover{background:var(--s2)}
.todaybtn:active{background:var(--s3)}
.todaybtn[disabled]{opacity:.35;pointer-events:none}

.nn{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;margin-top:6px;padding:5px 10px;border-radius:12px;background:var(--s2);font-size:13.5px;cursor:pointer;min-width:0}
.nn:active{background:var(--s3)}
.nn .nd{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c,var(--mut2))}
.nn .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nn .nt b{font-weight:700}
.nn .miss{color:#ffb454}
.nn .prog{flex:none;background:var(--s3)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:6px -6px 0;padding-bottom:8px}
.week .strip{margin-inline:var(--gut) 0}
.dchip{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0 4px;border-radius:13px;color:var(--mut);transition:background .2s,color .2s,transform .1s}
.dchip:active{transform:scale(.94);background:var(--s2)}
.dchip small{font-size:12px;font-weight:500}
.dchip b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--tx)}
.dchip.today b{box-shadow:inset 0 0 0 1.5px var(--mut2)}
.dchip.sel{background:var(--tx);color:#555}
.dchip.sel b{color:#0a0a0d;box-shadow:none}
.dchip i{display:flex;gap:3px;height:4px}
.dchip i s{width:4px;height:4px;border-radius:50%;background:var(--c)}
.dchip.sel i s{box-shadow:0 0 0 .5px rgba(0,0,0,.3)}

/* ───────── תפריט תחתון ───────── */
.dock{position:fixed;z-index:30;inset-inline-start:max(20px,calc(50% - 390px));bottom:calc(22px + var(--safe-b));height:62px;display:flex;align-items:center;gap:4px;padding:0 8px;
  border-radius:31px;background:rgba(27,27,34,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);
  box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .35s var(--ease),opacity .25s}
.dock .seg{background:transparent;padding:0}
.dock .seg::before{top:0;bottom:0;inset-inline-start:0;width:50%;background:var(--s3);border-radius:999px}
.dock .seg[data-v=week]::before{transform:translateX(-100%)}
.dock .seg button{min-width:58px;min-height:44px;padding:9px 14px;font-size:15px}
.dock .todaybtn{min-width:62px;min-height:44px;text-align:center;border-radius:999px;padding:9px 12px}
body.sheet-open .dock{transform:scale(.6);opacity:0;pointer-events:none}

/* ───────── אזור ראשי ───────── */
main{padding:0 16px calc(130px + var(--safe-b))}
main.slide-l{animation:slL .22s var(--ease)}
main.slide-r{animation:slR .22s var(--ease)}
@keyframes slL{from{opacity:.2;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:.2;transform:translateX(12px)}to{opacity:1;transform:none}}
.hintw{position:sticky;top:calc(var(--hdr,130px) + 14px);height:0;z-index:7}
.hint{position:absolute;inset-inline:0;top:0;padding:20px 18px;border-radius:18px;background:var(--s1);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.45);text-align:center;color:var(--mut);font-size:14.5px}
.hint b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}
.hint .row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:12px;background:var(--s2);color:var(--tx);font-size:14px;font-weight:600;transition:background .15s,transform .1s}
.btn:hover{background:var(--s3)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--tx);color:#0a0a0d}
.btn.pri:hover{background:#fff}
.btn.dng{color:var(--danger)}

/* ───────── קו זמן יומי ───────── */
.tl{position:relative;margin-top:6px;cursor:default}
.hl{position:absolute;inset-inline:0;height:0;border-top:1px solid var(--line);pointer-events:none}
.hl span{position:absolute;inset-inline-start:0;top:-8px;width:calc(var(--gut) - 8px);font-size:11px;color:var(--mut2);font-variant-numeric:tabular-nums;text-align:start}
.hl::after{content:"";position:absolute;inset-inline-start:calc(var(--gut) - 8px);top:-1px;width:8px;border-top:1px solid var(--bg)}
.lane{position:absolute;inset-inline-start:var(--gut);inset-inline-end:0;top:0;bottom:0}
.blk{position:absolute;border-radius:12px;background:linear-gradient(var(--cb),var(--cb)),var(--bg);overflow:hidden;cursor:pointer;
  display:flex;align-items:flex-start;padding:8px 10px 8px 12px;
  transition:background .25s,transform .12s,opacity .3s}
.bi{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0}
.blk::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3.5px;background:var(--c)}
.blk.short{padding-block:3px;align-items:center}
.blk.tiny{padding-block:0;align-items:center}
.short .bi,.tiny .bi{align-items:center}
.blk,.wb{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.blk.sel,.wb.sel{box-shadow:0 0 0 1.5px var(--c);z-index:7}
.blk.lift,.wb.lift{transform:scale(1.025);box-shadow:0 16px 36px rgba(0,0,0,.65),0 0 0 1.5px var(--c);z-index:9}
.blk.drag,.wb.drag{transition:none!important;z-index:9}
.wb.drag{box-shadow:0 12px 28px rgba(0,0,0,.6),0 0 0 1.5px var(--c)}
.rz{position:absolute;display:none;width:64px;height:20px;touch-action:none;z-index:6;cursor:ns-resize}
.rz::after{content:"";position:absolute;left:50%;margin-left:-14px;width:28px;height:4px;border-radius:2px;background:var(--tx);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.rz-t{top:0;inset-inline-end:12px}.rz-t::after{top:5px}
.rz-b{bottom:0;inset-inline-start:12px}.rz-b::after{bottom:5px}
.tiny .rz{height:12px}.tiny .rz-b{inset-inline-start:auto;inset-inline-end:12px}.tiny .rz::after{top:50%;bottom:auto;margin-top:-2px}
.blk.sel .rz,.blk.lift .rz{display:block}
@media(hover:hover){.blk:hover .rz{display:block}}
.tip{position:fixed;z-index:75;background:var(--tx);color:#0a0a0d;font-weight:700;font-size:13px;padding:3px 10px;border-radius:9px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.5);direction:ltr;font-variant-numeric:tabular-nums;transform:translate(-50%,-100%)}
.wcol.dropcol{background:rgba(255,255,255,.08)}
.bt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px;font:inherit;line-height:1.25;text-align:start;color:inherit;cursor:pointer}
.dense .bt .sub,.xdense .bt .sub{display:none}
.dense .bt b,.xdense .bt b{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;width:auto;font-size:13px;line-height:1.2}
.xdense .bt b{font-size:12px;-webkit-line-clamp:5}
.dense .bi{gap:6px}.dense .chk{width:20px;height:20px}.dense .chk svg{width:12px;height:12px}
.xdense{padding-inline:8px 4px}
.short .bt,.tiny .bt{flex-direction:row;align-items:center;gap:8px}
.bt b{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:15px;width:fit-content;
  background:linear-gradient(currentColor,currentColor) no-repeat 100% 55%/0 1.5px;transition:background-size .4s var(--ease),color .3s}
.tiny .bt b{font-size:13px}
.bt .sub{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt .tm{direction:ltr;unicode-bidi:isolate;display:inline-block}
.blk.done{background:linear-gradient(rgba(255,255,255,.045),rgba(255,255,255,.045)),var(--bg)}
.blk.done::before{opacity:.45}
.blk.done .bt b{background-size:100% 1.5px;color:var(--mut)}
.blk.done .bt .sub{opacity:.6}

/* כפתור סימון וי */
.chk{position:relative;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;
  transition:background .25s,border-color .25s,transform .12s}
.chk::before{content:"";position:absolute;inset:-9px}
.chk::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);opacity:0;pointer-events:none}
.chk:active{transform:scale(.86)}
.chk svg{width:16px;height:16px;fill:none;stroke:#0a0a0d;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chk path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .1s}
.done .chk{background:var(--c)}
.done .chk path{stroke-dashoffset:0;transition:stroke-dashoffset .38s cubic-bezier(.65,0,.35,1) .06s}
.chk.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.chk.pop::after{animation:ripple .65s ease-out}
@keyframes pop{0%{transform:scale(.78)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes ripple{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
.tiny .chk,.short .chk{width:22px;height:22px}
.tiny .chk svg,.short .chk svg{width:14px;height:14px}

.ghost{position:absolute;inset-inline:0;height:34px;border-radius:12px;background:rgba(255,255,255,.1);border:1.5px dashed var(--mut);z-index:4;pointer-events:none;animation:gh .45s var(--ease)}
@keyframes gh{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.now{position:absolute;inset-inline:calc(var(--gut) - 6px) 0;height:0;border-top:2px solid var(--danger);z-index:5;pointer-events:none}
.now::before{content:"";position:absolute;inset-inline-start:-1px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.now span{position:absolute;right:8px;top:-21px;font-size:11px;font-weight:700;color:var(--danger);background:var(--bg);padding:0 5px;border-radius:6px}
.week .now{inset-inline:0 0}

/* ───────── תצוגה שבועית ───────── */
.wk{position:relative}
.wcols{position:absolute;inset-inline-start:var(--gut);inset-inline-end:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr)}
.wcol{position:relative;border-inline-start:1px solid var(--line)}
.wcol.today{background:rgba(255,255,255,.03)}
.wb{position:absolute;border-radius:7px;background:linear-gradient(var(--cb),var(--cb)),var(--bg);overflow:hidden;cursor:pointer;padding:2px 4px 2px 3px;
  display:flex;flex-direction:column;align-items:flex-start;
  font-size:10.5px;line-height:1.18;font-weight:600;border-inline-start:2.5px solid var(--c);transition:opacity .3s,transform .12s}
.wt{display:block;width:100%;flex:1;min-height:0;overflow:hidden;word-break:break-word;text-align:start;color:inherit;font:inherit;line-height:inherit;cursor:pointer}
.wb.done{opacity:.45}
.wb.done .wt{text-decoration:line-through}
.chk.wchk{width:15px;height:15px;border-width:1.5px;margin-bottom:2px;flex:none}
.wchk::before{inset:-6px}
.wchk svg{width:10px;height:10px;stroke-width:3.6}
@media(max-width:619px){.wb.nt .wt{display:none}}
@media(min-width:620px){.wb{font-size:12.5px;padding:3px 6px}}

/* ───────── כפתור הוספה מהיר ───────── */
.fab{position:fixed;z-index:30;inset-inline-end:max(20px,calc(50% - 390px));bottom:calc(22px + var(--safe-b));width:62px;height:62px;border-radius:50%;
  background:var(--tx);color:#0a0a0d;display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.2) inset;
  transition:transform .35s var(--ease),opacity .25s,background .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none;transition:transform .35s var(--ease)}
.fab:hover svg{transform:rotate(90deg)}
body.sheet-open .fab,body.sheet-open .vbtn{transform:scale(.6);opacity:0;pointer-events:none}
.vbtn{position:fixed;z-index:30;inset-inline-end:calc(max(20px,calc(50% - 390px)) + 7px);bottom:calc(22px + 62px + 14px + var(--safe-b));width:48px;height:48px;border-radius:50%;background:var(--s3);border:1px solid var(--line2);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.5);transition:transform .35s var(--ease),opacity .25s}
.vbtn:active{transform:scale(.92)}
.vbtn svg,.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vbtn{color:var(--tx)}

/* ───────── חלונית (Sheet) ───────── */
.ov{touch-action:none;position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,0);transition:background .35s var(--ease)}
.ov.in{background:rgba(0,0,0,.55)}
.sheet{touch-action:pan-y;width:100%;max-width:520px;max-height:min(92dvh,760px);overflow:auto;overscroll-behavior:contain;
  background:var(--s1);border-radius:26px 26px 0 0;border:1px solid var(--line2);border-bottom:0;
  padding:0 18px calc(22px + var(--safe-b));transform:translateY(100%);transition:transform .42s var(--ease);
  box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.ov.in .sheet{transform:none}
@media(min-width:700px){
  .ov{align-items:center}
  .sheet{border-radius:26px;border-bottom:1px solid var(--line2);transform:translateY(24px) scale(.96);opacity:0;transition:transform .35s var(--ease),opacity .25s}
  .ov.in .sheet{opacity:1}
}
.shh{position:sticky;top:0;z-index:2;background:var(--s1);margin:0 -18px;padding:8px 18px 6px;touch-action:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 6px}
.hd{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.hd h2{margin:0;font-size:17px;font-weight:700}
.lnk{padding:8px 4px;color:var(--mut);font-size:16px;font-weight:500;min-width:56px}
.lnk.st{color:var(--tx);font-weight:700;text-align:end}
.lnk:active{opacity:.6}
.f{display:grid;gap:16px;padding-top:6px}
.tin{width:100%;background:none;border:0;outline:0;font-size:24px;font-weight:700;padding:6px 0;letter-spacing:-.01em;border-bottom:1px solid var(--line)}
.tin::placeholder{color:var(--mut2)}
.tin:focus{border-color:var(--mut)}
.lbl{display:block;font-size:12.5px;color:var(--mut);margin-bottom:7px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input,.dsel input,.rseg input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--s2);font-size:14px;font-weight:600;
  border:1.5px solid transparent;cursor:pointer;transition:background .2s,border-color .2s,transform .1s}
.chip span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip span:active{transform:scale(.95)}
.chip input:checked+span{background:var(--cb);border-color:var(--c)}
.chip input:focus-visible+span{outline:2px solid var(--tx);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{background:var(--s2);border-radius:14px;padding:9px 13px 7px}
.fld .lbl{margin:0 0 2px;font-size:12px}
.fld input,.fld textarea{width:100%;background:none;border:0;outline:0;font-size:17px;font-weight:600;padding:2px 0;color-scheme:dark;font-variant-numeric:tabular-nums}
.fld input[type=time],.fld input[type=date]{direction:ltr;text-align:start;min-height:28px}
.fld textarea{font-size:15px;font-weight:400;resize:none;min-height:46px}
.fld:focus-within{box-shadow:0 0 0 1.5px var(--mut2)}
.dur{display:flex;gap:7px;flex-wrap:wrap}
.dur button{padding:6px 11px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:600;color:var(--mut);transition:background .15s,color .15s,transform .1s}
.dur button:active{transform:scale(.94)}
.dur button.on{background:var(--tx);color:#0a0a0d}
.rseg{display:flex;background:var(--s2);border-radius:12px;padding:2px;gap:2px}
.rseg label{flex:1}
.rseg span{display:block;text-align:center;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;transition:background .2s,color .2s}
.rseg input:checked+span{background:var(--s3);color:var(--tx)}
.dsel{display:flex;gap:6px;justify-content:space-between;overflow:hidden;max-height:0;opacity:0;transition:max-height .4s var(--ease),opacity .3s,margin .3s;margin-top:-10px}
.dsel.open{max-height:60px;opacity:1;margin-top:0}
.dsel span{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--s2);font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;transition:background .2s,color .2s,transform .1s}
.dsel span:active{transform:scale(.92)}
.dsel input:checked+span{background:var(--tx);color:#0a0a0d}
.err{color:var(--danger);font-size:14px;min-height:0}
.err:empty{display:none}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.donebtn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:14px;background:var(--s2);font-size:15px;font-weight:600;text-align:start;transition:background .2s}
.donebtn:active{background:var(--s3)}
.donebtn .chk{width:24px;height:24px;pointer-events:none}
.donebtn .chk::before{display:none}
.nxt{font-size:13px;color:var(--mut);margin-top:-6px}
.nxt:empty{display:none}
.fld select{width:100%;background:none;border:0;outline:0;font-size:17px;font-weight:600;padding:3px 0;color:var(--tx);color-scheme:dark}
.dels{display:grid;gap:8px;margin-top:2px}
.priv{margin-top:14px;background:var(--s2);border-radius:14px;padding:4px 14px}
.priv summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:15px}
.priv ul{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:8px;color:var(--mut);font-size:13.5px;line-height:1.5}
.priv li b{color:var(--tx)}
.onb h2{margin:8px 0 10px;font-size:21px;letter-spacing:-.01em;text-align:center}
.onb ul{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:9px;color:var(--mut);font-size:14.5px;line-height:1.5}
.onb li{background:var(--s2);border-radius:13px;padding:10px 13px}
.onb li b{color:var(--tx)}
.sm-note{margin:8px 0;color:var(--mut);font-size:13px;line-height:1.5}
.srow{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 10px}
.sd{flex:none;width:9px;height:9px;border-radius:50%;background:var(--mut2)}
.sd.ok{background:var(--ok)}
.sd.err{background:#ffb454}
.sd.syn{background:var(--tx);animation:micpulse 1.4s ease-out infinite}
.keyrow{display:flex;gap:8px;margin:6px 0}
.keyrow input{flex:1;min-width:0;font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;direction:ltr;background:var(--s2);border:0;outline:0;border-radius:12px;padding:11px 12px;color:var(--tx)}
.keyrow .btn{padding:9px 13px;font-size:13.5px}
.nn .warn{color:#ffb454}
.sm-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.sm-nav b{font-size:15px;font-weight:600}
.sm-big{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.sm-big b{font-size:44px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sm-big span{color:var(--mut);font-size:14px;flex:1}
.sm-big em{font-style:normal;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--s3);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .6s var(--ease)}
.sm-sub{margin:0;color:var(--mut);font-size:13.5px}
.cr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0}
.cr i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cn{font-weight:600;font-size:15px}
.ch{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.ch b{color:var(--tx)}
.cb{grid-column:1/-1;height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.cb u,.cb s{display:block;height:100%;text-decoration:none}
.cb u{background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.cb s{background:var(--c)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.dc{display:flex;flex-direction:column;align-items:center;gap:4px}
.dbar{width:100%;max-width:34px;height:84px;display:flex;align-items:flex-end;background:var(--s2);border-radius:8px;overflow:hidden}
.dbar u{display:flex;align-items:flex-end;width:100%;background:rgba(255,255,255,.14);text-decoration:none}
.dbar s{display:block;width:100%;background:var(--tx);text-decoration:none}
.dc.heavy .dbar u{background:rgba(255,180,84,.35)}
.dc.heavy .dbar s{background:#ffb454}
.dc small{font-size:12px;color:var(--mut)}
.dc.today small:first-of-type{color:var(--tx);font-weight:700}
.dc .dh{font-size:10.5px;min-height:13px;color:var(--mut2)}
.sm-warn{margin:8px 0 0;color:#ffb454;font-size:13px}
#tray{position:relative}
.bdg{position:absolute;top:1px;inset-inline-end:0;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#0a0a0d;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;pointer-events:none}
.qa{display:flex;gap:8px;margin:6px 0 4px}
.qa input{flex:1;min-width:0;background:var(--s2);border:0;outline:0;border-radius:12px;padding:11px 13px;font-size:16px;color:var(--tx)}
.qa input:focus{box-shadow:0 0 0 1.5px var(--mut2)}
.qa input::placeholder{color:var(--mut2)}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.tr-t{flex:1;min-width:0}
.tr-t b{display:block;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-t small{color:var(--mut);font-size:12.5px}
.tr-a{display:flex;gap:6px;flex:none}
.mini{padding:7px 11px;border-radius:10px;background:var(--s2);font-size:13px;font-weight:600}
.mini:active{background:var(--s3)}
.mini.dng{color:var(--danger)}
.empty{text-align:center;color:var(--mut);padding:22px 0}
.vact .full{grid-column:1/-1}
.swrow{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:14px;padding:11px 14px;cursor:pointer;font-size:15px;font-weight:600}
.swrow input{position:absolute;opacity:0;pointer-events:none}
.swrow .sw{flex:none;width:42px;height:26px;border-radius:13px;background:var(--s3);position:relative;transition:background .2s}
.swrow .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:transform .25s var(--ease)}
.swrow input:checked+.sw{background:var(--ok)}
.swrow input:checked+.sw::after{transform:translateX(-16px)}
.swrow input:focus-visible+.sw{outline:2px solid var(--tx);outline-offset:2px}
.swrow small{display:block;color:var(--mut);font-weight:400;font-size:12.5px}
.vwrap{display:grid;gap:12px;padding-top:4px}
.mic{width:84px;height:84px;border-radius:50%;background:var(--tx);color:#0a0a0d;display:grid;place-items:center;margin:6px auto 0;transition:background .2s,transform .12s}
.mic svg{width:34px;height:34px;stroke-width:2}
.mic:active{transform:scale(.94)}
.mic[disabled]{opacity:.35}
.mic.rec{background:var(--danger);color:#fff;animation:micpulse 1.4s ease-out infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.55)}100%{box-shadow:0 0 0 26px rgba(255,107,107,0)}}
.vstat{text-align:center;color:var(--mut);font-size:14px;min-height:21px}
.vstat.err{color:#ffb454}
.vtxt{width:100%;background:var(--s2);border:0;outline:0;border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.4;resize:none;min-height:66px;color:var(--tx)}
.vtxt:focus{box-shadow:0 0 0 1.5px var(--mut2)}
.vtxt::placeholder{color:var(--mut2)}
.pv{background:var(--s2);border-radius:16px;padding:12px 14px;display:grid;gap:7px}
.pv-h{display:flex;align-items:center;gap:8px;min-width:0}
.pv-h i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.pv-h b{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-h span{margin-inline-start:auto;flex:none;font-size:12.5px;color:var(--mut)}
.pv-r{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.pv-r span{color:var(--mut)}
.pv-r b{font-weight:600;text-align:end}
.pv-n{font-size:13px;color:#ffb454}
.vact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vact .btn{padding:12px;font-size:15px}
.vact .btn[disabled]{opacity:.35;pointer-events:none}
.vnote{margin:2px 0 0;color:var(--mut2);font-size:12.5px;text-align:center}
.blk.routine{background:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,.03)),var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.blk.routine::before{opacity:.55;width:2.5px}
.blk.routine .bt b{font-weight:500;color:var(--mut)}
.blk.routine .bt .sub{opacity:.8}
.wb.routine{opacity:.6;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line)}
.dels .btn{width:100%;padding:12px}

/* הגדרות */
.sec{font-size:12.5px;color:var(--mut);margin:18px 0 8px;font-weight:600;letter-spacing:.02em}
.crow{display:flex;align-items:center;gap:10px;padding:6px 0}
.crow input[type=text]{flex:1;min-width:0;background:var(--s2);border:0;outline:0;border-radius:11px;padding:10px 12px;font-size:15px}
.crow input[type=text]:focus{box-shadow:0 0 0 1.5px var(--mut2)}
.crow input[type=color]{appearance:none;-webkit-appearance:none;width:34px;height:34px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer;flex:none}
.crow input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.crow input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.crow input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.crow .ib{width:34px;height:34px}
.list{display:grid;gap:8px}
.list .btn{width:100%;text-align:start;display:flex;justify-content:space-between}

/* הודעה קצרה */
.toast{position:fixed;z-index:80;inset-inline:16px;bottom:calc(98px + var(--safe-b));margin:0 auto;max-width:420px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border-radius:16px;
  background:rgba(38,38,47,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);
  font-size:14.5px;font-weight:500;box-shadow:0 12px 34px rgba(0,0,0,.5);
  transform:translateY(20px) scale(.96);opacity:0;transition:transform .4s var(--ease),opacity .25s;pointer-events:none}
.toast.in{transform:none;opacity:1;pointer-events:auto}
.toast button{color:#9db4ff;font-weight:700;padding:4px 2px}

:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .sheet{transition:opacity .2s!important}
}
@media(prefers-reduced-transparency:reduce){
  .top{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
  .toast{background:var(--s3);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media(prefers-contrast:more){:root{--line:rgba(255,255,255,.22);--mut:#b4b4c0}}
</style>

<body>
<div id="app">
  <header class="top" id="top">
    <div class="r1">
      <div class="ttl"><h1 id="h1"></h1><p><span id="h2t"></span></p></div>

      <button class="ib" id="gear" aria-label="הגדרות וקטגוריות">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ═════════ כלי עזר ═════════ */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => addDays(d, -d.getDay());           // שבוע מתחיל ביום ראשון
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmt = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const DL = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
const MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ═════════ נתונים ═════════ */
const STORE = 'agenda.v1';
const DEFAULT_CATS = [
  { id: 'school',   name: 'בית ספר',  color: '#5aa9ff' },
  { id: 'gym',      name: 'אימון',    color: '#ff8a4c' },
  { id: 'recovery', name: 'התאוששות', color: '#3ddc97' },
  { id: 'personal', name: 'אישי',     color: '#b794f6' },
  { id: 'cindy',    name: 'סינדי',    color: '#ff6b9d' }
];
const PALETTE = ['#5aa9ff', '#ff8a4c', '#3ddc97', '#b794f6', '#ff6b9d', '#ffd166', '#2dd4bf', '#f87171', '#a3e635', '#94a3b8'];
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/, DKEY_RE = /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
const validDate = k => typeof k === 'string' && DKEY_RE.test(k) && keyOf(parseKey(k)) === k;
/* ניקוי ואימות: כל נתון שנטען (מהמכשיר או מגיבוי) עובר כאן, כדי שקובץ פגום לא ישבור את האפליקציה */
function clean(raw) {
  let dropped = 0;
  raw = raw && typeof raw === 'object' ? raw : {};
  const hex = c => { if (typeof c !== 'string') return null; c = c.trim(); if (/^#[0-9a-f]{3}$/i.test(c)) c = '#' + [...c.slice(1)].map(x => x + x).join(''); return /^#[0-9a-f]{6}$/i.test(c) ? c.toLowerCase() : null; };
  const seen = new Set();
  const cats = (Array.isArray(raw.cats) ? raw.cats : [])
    .filter(c => c && typeof c.id === 'string' && c.id && typeof c.name === 'string' && !seen.has(c.id) && seen.add(c.id))
    .slice(0, 40).map((c, i) => ({ id: c.id, name: c.name.trim().slice(0, 24) || 'קטגוריה', color: hex(c.color) || PALETTE[i % PALETTE.length] }));
  if (!cats.length) DEFAULT_CATS.forEach(c => cats.push({ ...c }));
  const ids = new Set(), tasks = [];
  (Array.isArray(raw.tasks) ? raw.tasks : []).forEach(t => {
    if (!t || typeof t !== 'object' || !TIME_RE.test(t.start) || !TIME_RE.test(t.end) || t.start === t.end || !validDate(t.date)) { dropped++; return; }
    const r = t.repeat && typeof t.repeat === 'object' ? t.repeat : {};
    const type = ['none', 'daily', 'weekly'].includes(r.type) ? r.type : 'none';
    let days = type === 'weekly' ? [...new Set((Array.isArray(r.days) ? r.days : []).map(Number).filter(n => Number.isInteger(n) && n >= 0 && n <= 6))] : [];
    if (type === 'weekly' && !days.length) days = [parseKey(t.date).getDay()];
    const id = typeof t.id === 'string' && t.id && !ids.has(t.id) ? t.id : uid(); ids.add(id);
    const done = {};
    if (t.done && typeof t.done === 'object') Object.keys(t.done).forEach(k => { if (validDate(k) && t.done[k]) done[k] = Number(t.done[k]) || 1; });
    const cat = cats.some(c => c.id === t.cat) ? t.cat : cats[0].id;
    const out = {
      id, title: String(t.title == null ? '' : t.title).trim().slice(0, 80) || cats.find(c => c.id === cat).name, cat,
      start: t.start, end: t.end, date: t.date, notes: typeof t.notes === 'string' ? t.notes.slice(0, 300) : '',
      done, skip: Array.isArray(t.skip) ? t.skip.filter(validDate) : [], repeat: { type, days }, routine: !!t.routine
    };
    if (validDate(t.until)) out.until = t.until;
    if (t.dismissed) out.dismissed = true;
    if (Number.isFinite(t.u)) out.u = t.u;
    if (t.remind === 'n' || [0, 5, 10, 15, 30, 60, 120, 1440].includes(t.remind)) out.remind = t.remind;
    tasks.push(out);
  });
  const inbox = (Array.isArray(raw.inbox) ? raw.inbox : []).filter(x => x && typeof x.title === 'string' && x.title.trim()).slice(0, 200).map(x => ({ id: typeof x.id === 'string' && x.id ? x.id : uid(), title: x.title.trim().slice(0, 80), cat: cats.some(c => c.id === x.cat) ? x.cat : cats[0].id, ...(Number.isFinite(x.u) ? { u: x.u } : {}) }));
  const tomb = {};
  if (raw.tomb && typeof raw.tomb === 'object') Object.entries(raw.tomb).slice(0, 2000).forEach(([id, ts]) => { if (id.length <= 40 && Number.isFinite(ts)) tomb[id] = ts; });

function layout(list, ppm, minH) {

const sheetStack = [];

  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  $('#layer').append(ov);
  document.body.classList.add('sheet-open');
  const sheet = ov.firstElementChild;

  let closed = false;
  const close = () => {
    if (closed) return; closed = true;

    const i = sheetStack.indexOf(close); if (i >= 0) sheetStack.splice(i, 1);
    if (!sheetStack.length) document.body.classList.remove('sheet-open');
    setTimeout(() => ov.remove(), 450);

  sheetStack.push(close);
  ov.addEventListener('pointerdown', e => { if (e.target === ov) close(); });
  sheet.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  dragToDismiss(sheet, $('.shh', sheet), close);

}

/* גרירה לסגירה: עוקב 1:1 אחרי האצבע, והמהירות קובעת אם לסגור */
function dragToDismiss(sheet, handle, close) {

  let y0 = 0, dy = 0, id = null, hist = [];

    dy = e.clientY - y0; hist.push([e.timeStamp, e.clientY]); hist = hist.slice(-5);
    const off = dy > 0 ? dy : -(Math.abs(dy) * 40 / (Math.abs(dy) + 120));   // התנגדות בקצה העליון
    sheet.style.transform = `translateY(${off}px)`;

  const end = e => {
    if (e.pointerId !== id) return; id = null;
    sheet.style.transition = '';

    S.lastCat = catId;

  });

  }));
  const io = $('#icsOne', sheet); if (io) io.onclick = () => exportICS([task], 'האירוע מוכן');
  if (!edit && matchMedia('(pointer:fine)').matches) setTimeout(() => { try { $f('title').focus({ preventScroll: true }); } catch (e) {} }, 380);
}

/* ═════════ הבנת משפט בעברית ═════════
   "אימון חדר כושר מחר בחמש וחצי לשעה וחצי" → כותרת, קטגוריה, תאריך, שעות, חזרה.
   כללים בלבד (בלי שרת). תמיד מציגים את מה שהובן לפני ההוספה, ואפשר לתקן. */
const V_HW = 'אחת עשרה|אחד עשר|שתים עשרה|שתיים עשרה|שנים עשר|שתיים|שניים|שתים|שלוש|ארבע|חמש|שמונה|שבע|תשע|עשר|אחת|אחד|שש|חצות';
const V_HWMAP = { 'אחת עשרה': 11, 'אחד עשר': 11, 'שתים עשרה': 12, 'שתיים עשרה': 12, 'שנים עשר': 12, 'שתיים': 2, 'שניים': 2, 'שתים': 2, 'שלוש': 3, 'ארבע': 4, 'חמש': 5, 'שמונה': 8, 'שבע': 7, 'תשע': 9, 'עשר': 10, 'אחת': 1, 'אחד': 1, 'שש': 6, 'חצות': 0 };
const V_WD = 'ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת';
const V_WDMAP = { 'ראשון': 0, 'שני': 1, 'שלישי': 2, 'רביעי': 3, 'חמישי': 4, 'שישי': 5, 'שבת': 6 };
const V_MINMAP = { 'חצי': 30, 'רבע': 15, 'עשרה': 10, 'עשרים': 20, 'חמש': 5, 'עשרים וחמש': 25 };
const V_NUMW = { 'אחת': 1, 'אחד': 1, 'שתי': 2, 'שני': 2, 'שלוש': 3, 'שלושה': 3, 'ארבע': 4, 'ארבעה': 4, 'חמש': 5, 'חמישה': 5, 'שש': 6, 'שישה': 6, 'שבע': 7, 'שבעה': 7, 'שמונה': 8, 'תשע': 9, 'תשעה': 9, 'עשר': 10, 'עשרה': 10 };
const V_CATWORDS = {
  'אימון': ['אימון', 'אימונים', 'חדר כושר', 'כושר', 'ריצה', 'ספורט', 'קרוספיט', 'כדורסל', 'כדורגל', 'שחייה', 'משקולות', 'אופניים', 'טניס', 'קראטה', 'התעמלות'],
  'התאוששות': ['מתיחות', 'התאוששות', 'מנוחה', 'עיסוי', 'יוגה', 'פילאטיס', 'שינה', 'אמבט קרח', 'ספא'],
  'בית ספר': ['בית ספר', 'בית הספר', 'ביה"ס', 'שיעור', 'שיעורים', 'שיעורי בית', 'מבחן', 'בוחן', 'לימודים', 'תגבור', 'פרויקט', 'מטלה', 'מתמטיקה', 'אנגלית', 'פיזיקה', 'היסטוריה', 'ספרות', 'כימיה', 'ביולוגיה'],
  'אישי': ['ארוחה', 'ארוחת', 'קניות', 'רופא', 'תור', 'חברים', 'פגישה', 'טיול', 'סרט', 'קריאה', 'כביסה', 'ניקיון']
};

function parseVoice(raw, ctx) {
  const now = ctx.now || new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const plus = n => { const x = new Date(base); x.setDate(x.getDate() + n); return x; };
  const hhmm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  let t = ' ' + String(raw || '').replace(/[־–—]/g, '-').replace(/[”“״]/g, '"').replace(/[’‘׳]/g, "'").replace(/\s+/g, ' ') + ' ';
  const orig = t;
  const B = '(^|[^א-ת\\d])', E = '(?![א-ת])';
  const cut = re => {
    const m = t.match(re); if (!m) return null;
    t = t.slice(0, m.index) + (m[1] || '') + ' ' + t.slice(m.index + m[0].length);
    return m;
  };
  const res = { text: String(raw || '').trim(), title: '', cat: null, date: null, start: null, end: null, repeat: { type: 'none', days: [] }, guessed: false };

  /* חזרה */
  const WDT = `[ובלמ]?(?:${V_WD})${E}`;
  const wdList = s => [...s.matchAll(new RegExp(`[ובלמ]?(${V_WD})`, 'g'))].map(x => V_WDMAP[x[1]]);
  const range = (a, b) => { const out = [a]; let i = a; while (i !== b && out.length < 8) { i = (i + 1) % 7; out.push(i); } return out; };
  let m;
  if (cut(new RegExp(`${B}(?:כל|בכל|מדי)\\s+(?:יום|יום ביומו)${E}(?!\\s+[בול]?(?:${V_WD})${E})`))) res.repeat = { type: 'daily', days: [] };
  else if ((m = cut(new RegExp(`${B}כל\\s+(בוקר|ערב|לילה)${E}`)))) { res.repeat = { type: 'daily', days: [] }; res._part = { 'בוקר': 'am', 'ערב': 'eve', 'לילה': 'night' }[m[2]]; }
  else if (cut(new RegExp(`${B}(?:ב|כל\\s+)?ימי\\s+חול${E}`))) res.repeat = { type: 'weekly', days: [0, 1, 2, 3, 4] };
  else if (cut(new RegExp(`${B}(?:ב|כל\\s+)?סופי?\\s+שבוע${E}`))) res.repeat = { type: 'weekly', days: [5, 6] };
  else if ((m = cut(new RegExp(`${B}(?:כל|בכל|בימי|בימים|ימי|ימים)\\s+(?:יום\\s+)?((?:${WDT}[\\s,]*(?:עד\\s+(?=${WDT})|-\\s*(?=${WDT}))?)+)`)))) {
    const days = wdList(m[2]);
    res.repeat = { type: 'weekly', days: /עד|-/.test(m[2]) && days.length === 2 ? range(days[0], days[1]) : [...new Set(days)] };
  } else if (cut(new RegExp(`${B}כל\\s+שבוע${E}`))) res.repeat = { type: 'weekly', days: [] };
  else if ((m = cut(new RegExp(`${B}מ?(${V_WD})\\s+עד\\s+(${V_WD})${E}`)))) res.repeat = { type: 'weekly', days: range(V_WDMAP[m[2]], V_WDMAP[m[3]]) };

  /* משך */
  let dur = null;
  if ((m = cut(new RegExp(`${B}(?:ל|למשך\\s+)?(שעתיים וחצי|שעתיים|שעה וחצי|שעה ורבע|חצי שעה|רבע שעה|שלושת רבעי שעה|שלושה רבעי שעה)${E}`)))) dur = { 'שעתיים וחצי': 150, 'שעתיים': 120, 'שעה וחצי': 90, 'שעה ורבע': 75, 'חצי שעה': 30, 'רבע שעה': 15, 'שלושת רבעי שעה': 45, 'שלושה רבעי שעה': 45 }[m[2]];
  else if ((m = cut(new RegExp(`${B}(?:ל|למשך\\s+)?(\\d+(?:[.,]\\d+)?)\\s*(שעות|שעה|דקות|דקה|דק')${E}`)))) { const n = parseFloat(m[2].replace(',', '.')); dur = Math.round(/^ש/.test(m[3]) ? n * 60 : n); }
  else if ((m = cut(new RegExp(`${B}(?:ל|למשך\\s+)?(${Object.keys(V_NUMW).join('|')})\\s+(שעות|דקות)${E}`)))) dur = V_NUMW[m[2]] * (m[3] === 'שעות' ? 60 : 1);
  else if ((m = cut(new RegExp(`${B}(?:ל|למשך\\s+)?(עשרים וחמש|עשרים|שלושים|ארבעים וחמש|ארבעים|חמישים|חמש עשרה)\\s+דקות${E}`)))) dur = { 'עשרים וחמש': 25, 'עשרים': 20, 'שלושים': 30, 'ארבעים וחמש': 45, 'ארבעים': 40, 'חמישים': 50, 'חמש עשרה': 15 }[m[2]];
  else if ((m = cut(new RegExp(`${B}(?:ל|למשך\\s+)?שעה${E}(?!\\s+(?:\\d|(?:${V_HW})${E}|ו))`)))) dur = 60;

  /* תאריך */
  let dateOff = null, wd = null, absDate = null;
  if ((m = cut(new RegExp(`${B}ה(ערב|לילה)${E}`)))) { res._part = m[2] === 'ערב' ? 'eve' : 'night'; dateOff = 0; }
  if ((m = cut(new RegExp(`${B}(היום|מחר|מחרתיים|מחרתים)${E}`)))) dateOff = { 'היום': 0, 'מחר': 1, 'מחרתיים': 2, 'מחרתים': 2 }[m[2]];
  else if ((m = cut(new RegExp(`${B}בעוד\\s+(\\d+|יומיים|שבוע|שבועיים)(?:\\s+ימים)?${E}`)))) dateOff = { 'יומיים': 2, 'שבוע': 7, 'שבועיים': 14 }[m[2]] ?? parseInt(m[2], 10);
  else if ((m = cut(new RegExp(`${B}(?:ב-?|ל-?)?(\\d{1,2})[/.](\\d{1,2})(?:[/.](\\d{2,4}))?(?![\\d:])`))) && +m[3] >= 1 && +m[3] <= 12 && +m[2] >= 1 && +m[2] <= 31) {
    let y = m[4] ? (+m[4] < 100 ? 2000 + +m[4] : +m[4]) : base.getFullYear();
    let d = new Date(y, +m[3] - 1, +m[2]); if (!m[4] && d < base) d = new Date(y + 1, +m[3] - 1, +m[2]); absDate = d;
  } else if ((m = cut(new RegExp(`${B}(?:(?:ב|ל)?יום\\s+|ב|ל)(${V_WD})(?:\\s+הקרוב)?${E}`)))) wd = V_WDMAP[m[2]];

  /* חלקי יום (בוקר/ערב...): נאספים עם המיקום, וכל שעה מקבלת את החלק הקרוב אליה */
  const partDefs = [
    [`${B}(?:אחר|אחרי)\\s+הצהריים${E}`, 'pm'], [`${B}אחה["']?צ${E}`, 'pm'],
    [`${B}(?:לפנות\\s+בוקר|לפני\\s+הצהריים)${E}`, 'am'], [`${B}ב(?:צהריים|צהרים)${E}`, 'noon'],
    [`${B}בבוקר${E}`, 'am'], [`${B}בערב${E}`, 'eve'], [`${B}בלילה${E}`, 'night']
  ];
  const parts = [];
  for (const [src, val] of partDefs) for (const k of t.matchAll(new RegExp(src, 'g'))) parts.push({ idx: k.index + (k[1] || '').length, len: k[0].length - (k[1] || '').length, val });
  parts.sort((x, y) => x.idx - y.idx);
  const globalPart = res._part || null;

  /* שעות */
  const hv = (d, w) => d !== undefined ? parseInt(d, 10) : V_HWMAP[w];
  const clkRe = new RegExp(`${B}(עד(?:\\s+השעה)?\\s+|בשעה\\s+|משעה\\s+|שעה\\s+|[במל]-?\\s*)?(?:(רבע|עשרה|חמישה|עשרים)\\s+ל-?(?:(\\d{1,2})|(${V_HW}))|(?:(\\d{1,2}):(\\d{2})|(\\d{1,2})|(${V_HW}))(?:\\s+ו-?(עשרים וחמש|עשרים|חצי|רבע|עשרה|חמש))?)(?![א-ת\\d:])`, 'g');
  const clocks = [];
  for (const k of t.matchAll(clkRe)) {
    const prefix = (k[2] || '').trim(), colon = k[6] !== undefined;
    if (!prefix && !colon && !k[3]) continue;                                   // מספר בלי "ב"/"מ"/"עד" אינו שעה (למשל "3 סטים")
    let h, mi = 0;
    if (k[3]) { h = hv(k[4], k[5]); mi = 60 - ({ 'רבע': 15, 'עשרה': 10, 'חמישה': 5, 'עשרים': 20 }[k[3]]); h = (h + 23) % 24 || 12; }
    else if (colon) { h = +k[6]; mi = +k[7]; }
    else { h = hv(k[8], k[9]); mi = k[10] ? V_MINMAP[k[10]] : 0; }
    if (h === undefined || isNaN(h) || h > 24 || mi > 59) continue;
    const lead = (k[1] || '').length;
    clocks.push({ idx: k.index + lead, len: k[0].length - lead, prefix, h, mi, colon });
  }
  clocks.forEach((c, i) => {
    const end = c.idx + c.len, nextStart = i + 1 < clocks.length ? clocks[i + 1].idx : Infinity, prevEnd = i ? clocks[i - 1].idx + clocks[i - 1].len : -1;
    const near = parts.find(x => x.idx >= end && x.idx < nextStart) || [...parts].reverse().find(x => x.idx < c.idx && x.idx >= prevEnd);
    c.part = near ? near.val : (parts.length === 1 ? parts[0].val : globalPart);
  });
  for (const x of [...clocks, ...parts].sort((p, q) => q.idx - p.idx)) t = t.slice(0, x.idx) + ' ' + t.slice(x.idx + x.len);

  /* קטגוריה */
  const low = orig.toLowerCase();
  let catId = null;
  for (const c of ctx.cats || []) if (c.name && low.includes(c.name.toLowerCase())) { catId = c.id; break; }

  const eveningCat = /אימון|התאוששות|סינדי|אישי/.test(catName) || /ערב|לילה/.test(orig);

}

/* ═════════ ייצוא ליומן של הטלפון (קובץ ICS) — כך מקבלים תזכורות אמיתיות ═════════ */

const OVERLOAD_MIN = 600;                                  // יותר מ־10 שעות מתוכננות ביום = יום עמוס
const endAt = (t, k) => { const p = span(t), d0 = parseKey(k); return new Date(d0.getFullYear(), d0.getMonth(), d0.getDate(), 0, p.over ? p.e + 1440 : p.e); };

/* משימות רגילות בלבד (שגרה לא נכללת). "מועד" = המשימה הסתיימה או כבר סומנה, ורק עליה מחשבים אחוז ביצוע */
function weekStats(ws, now = new Date()) {
  const out = { tasks: 0, planned: 0, done: 0, due: 0, byCat: {}, byDay: [] };
  for (let i = 0; i < 7; i++) {
    const k = keyOf(addDays(ws, i)), day = { k, planned: 0, done: 0, n: 0, heavy: false };
    occ(k).forEach(t => {
      if (t.routine) return;
      const d = durMin(t), isD = isDone(t, k), ended = endAt(t, k) <= now;
      out.tasks++; out.planned += d; day.planned += d; day.n++;
      const c = out.byCat[t.cat] || (out.byCat[t.cat] = { planned: 0, doneMin: 0, n: 0, doneN: 0 });
      c.planned += d; c.n++;
      if (isD) { out.done++; day.done += d; c.doneMin += d; c.doneN++; }
      if (isD || ended) out.due++;
    });
    day.heavy = day.planned > OVERLOAD_MIN; out.byDay.push(day);
  }
  return out;
}
/* רצף: כמה מופעים אחרונים ברצף (בקטגוריה) בוצעו בלי החמצה. נספרים רק מופעים שהסתיימו, 60 יום אחורה */

  const tk = keyOf(now), by = {};
  for (let i = 0; i < 60; i++) {
    const k = keyOf(addDays(parseKey(tk), -i));
    occ(k).forEach(t => { if (t.routine || endAt(t, k) > now) return; (by[t.cat] = by[t.cat] || []).push({ k, s: t.start, done: isDone(t, k) }); });
  }
  return Object.entries(by).map(([c, list]) => {
    list.sort((a, b) => b.k.localeCompare(a.k) || b.s.localeCompare(a.s));
    let n = 0; for (const x of list) { if (!x.done) break; n++; }
    return { cat: c, n, total: list.length };
  }).filter(x => x.n >= 2 && x.total >= 3).sort((a, b) => b.n - a.n).slice(0, 4);
}

    const txt = st === 'ok' ? `מסונכרן · ${ago(sync.last)}` : st === 'syncing' ? 'מסנכרן…' : st === 'offline' ? 'אין חיבור. הכול נשמר במכשיר ויסונכרן כשהחיבור יחזור' : st === 'idle' ? 'ממתין לסנכרון' : sync.err || 'שגיאת סנכרון';
    box.innerHTML = `<div class="srow"><i class="sd ${cls}"></i><span id="sStat">${esc(txt)}</span></div>
      <div class="keyrow"><input id="sKey" readonly dir="ltr" aria-label="מפתח הסנכרון שלך" value="${shown ? fmtKey(sync.key) : '••••-••••-••••-••••-••••-••••-••'}"><button class="btn" id="sShow">${shown ? 'הסתר' : 'הצג'}</button><button class="btn" id="sCopy">העתק</button></div>
      <p class="sm-note">את המפתח הזה מזינים במכשיר חדש כדי לחבר אותו. שמרו אותו במקום בטוח. אם הוא אובד, אי אפשר לחבר מכשיר נוסף.</p>
      <div class="list"><button class="btn" id="sNow">סנכרן עכשיו</button><button class="btn" id="sOff">הפסק סנכרון במכשיר הזה</button><button class="btn dng" id="sDel">מחק את הנתונים שלי מהענן</button></div>`;
    $('#sShow', box).onclick = () => { shown = !shown; draw(); };
    $('#sCopy', box).onclick = async () => { try { await navigator.clipboard.writeText(fmtKey(sync.key)); toast('המפתח הועתק'); } catch (e) { shown = true; draw(); const i = $('#sKey', box); i.select(); toast('סמנו והעתיקו ידנית'); } };
    $('#sNow', box).onclick = () => doSync();
    $('#sOff', box).onclick = async () => { if (await ask('המכשיר הזה יפסיק להסתנכרן. הנתונים שבו והנתונים בענן נשארים.', 'הפסק')) { stopSync(); draw(); } };
    $('#sDel', box).onclick = async () => { if (await ask('כל הנתונים שלכם יימחקו מהענן, ובכל המכשירים המחוברים הסנכרון יפסיק לעבוד. הנתונים שבמכשיר הזה נשארים.', 'מחק מהענן')) { try { await deleteCloud(); toast('נמחק מהענן'); } catch (e) { toast('המחיקה נכשלה, בדקו חיבור'); } draw(); } };
  };
  syncUI = () => { draw(); drawPush(sheet); }; syncUI();
}

/* ═════════ התראות Push אמיתיות ═════════
   המכשיר מחשב את כל התזכורות ל־30 הימים הקרובים ומעלה אותן, והשרת שולח כל אחת בזמנה גם כשהאפליקציה סגורה. */
const PUSHKEY = 'agenda.push', TESTKEY = 'agenda.pushtest';
const pushOn = () => { try { return localStorage.getItem(PUSHKEY) === '1'; } catch (e) { return false; } };
const setPushOn = v => { try { v ? localStorage.setItem(PUSHKEY, '1') : localStorage.removeItem(PUSHKEY); } catch (e) {} };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64uToBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), c => c.charCodeAt(0));

const reminderBody = (t, r) => `${r === 0 ? 'מתחיל עכשיו' : 'בעוד ' + (r < 60 ? r + ' דקות' : r === 60 ? 'שעה' : r === 120 ? 'שעתיים' : 'יום')} · ${t.start}–${t.end}`;
function readTest(now) {
  try { const o = JSON.parse(localStorage.getItem(TESTKEY)); if (o && new Date(o.at) > new Date(now.getTime() - 120000)) return { rid: o.rid, at: o.at, title: 'בדיקת התראה', body: 'ההתראות עובדות', url: './' }; } catch (e) {}
  return null;
}
function buildReminders(now = new Date(), days = 30) {            // רק משימות רגילות שעוד לא בוצעו ושהזמן שלהן בעתיד
  const out = [], tk = keyOf(now);
  for (let i = 0; i < days; i++) {
    const k = keyOf(addDays(parseKey(tk), i)), d0 = parseKey(k);
    occ(k).forEach(t => {
      if (t.routine || isDone(t, k)) return;
      const r = remindOf(t); if (r === 'n') return;
      const at = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate(), 0, span(t).s - r);
      if (at <= new Date(now.getTime() + 30000)) return;
      out.push({ rid: `${t.id}|${k}`, at: at.toISOString(), title: t.title.slice(0, 120), body: reminderBody(t, r), url: './' });
    });
  }
  out.sort((a, b) => a.at.localeCompare(b.at));
  const test = readTest(now); if (test) out.unshift(test);
  return out.slice(0, 700);
}

let remTimer = 0, lastRem = '', pushRefreshed = false;
function queueReminders(ms = 3000) { if (!sync.key || DEMO || !pushOn()) return; clearTimeout(remTimer); remTimer = setTimeout(() => uploadReminders(), ms); }
async function uploadReminders(force) {
  if (!sync.key || !pushOn()) return;
  const items = buildReminders(), sig = canon(items.map(i => [i.rid, i.at, i.title, i.body]));
  if (!force && sig === lastRem) return;
  try { await cloud('agenda_set_reminders', { p_key: sync.key, p_items: items }); lastRem = sig; } catch (e) { /* ינסה שוב בסנכרון הבא */ }
}
async function refreshPush() {                                    // פעם בכל פתיחה: מוודא שהמנוי של המכשיר עדיין שמור בשרת
  if (pushRefreshed || !pushOn() || !sync.key || !pushSupported()) return;
  pushRefreshed = true;
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) await cloud('agenda_save_push', { p_key: sync.key, p_sub: sub.toJSON() });
  } catch (e) {}
}
const sameKey = (sub, bytes) => { try { const k = new Uint8Array(sub.options.applicationServerKey); return k.length === bytes.length && k.every((v, i) => v === bytes[i]); } catch (e) { return true; } };

async function enablePush() {
  if (!sync.key) throw new Error('need_sync');
  if (!pushSupported()) throw new Error('unsupported');
  if (isIOS() && !isStandalone()) throw new Error('ios_install');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('denied');
  const pub = await cloud('agenda_vapid', {});
  if (!pub) throw new Error('no_vapid');
  const bytes = b64uToBytes(pub), reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (sub && !sameKey(sub, bytes)) { await sub.unsubscribe(); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes });
  await cloud('agenda_save_push', { p_key: sync.key, p_sub: sub.toJSON() });
  setPushOn(true); pushRefreshed = true;
  await uploadReminders(true);
}
async function disablePush() {
  setPushOn(false);
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { const ep = sub.endpoint; await sub.unsubscribe(); if (sync.key) await cloud('agenda_drop_push', { p_key: sync.key, p_endpoint: ep }).catch(() => {}); }
  } catch (e) {}
}
async function sendTestPush() {                                   // תזכורת בדיקה בעוד כ־75 שניות; השרת שולח אותה בדקה הקרובה
  try { localStorage.setItem(TESTKEY, JSON.stringify({ rid: 'test|' + Date.now(), at: new Date(Date.now() + 75000).toISOString() })); } catch (e) {}
  await uploadReminders(true);
}

function drawPush(sheet) {
  const box = $('#pushBox', sheet); if (!box) return;
  const note = t => { box.innerHTML = `<p class="sm-note">${t}</p>`; };
  if (!sync.key) return note('התראות דורשות סנכרון, כדי שהשרת ידע מה לתזכר. הפעילו קודם את הסנכרון.');
  if (!pushSupported()) return note('הדפדפן הזה לא תומך בהתראות. אפשר להשתמש בייצוא ליומן של הטלפון.');
  if (isIOS() && !isStandalone()) return note('באייפון ההתראות עובדות רק אחרי שמוסיפים את האפליקציה למסך הבית (שיתוף ← הוסף למסך הבית) ופותחים אותה משם.');
  if (Notification.permission === 'denied') return note('ההתראות חסומות בהגדרות המכשיר. אפשר לאפשר אותן שם ולחזור לכאן.');
  const on = pushOn();
  box.innerHTML = `<p class="sm-note">${on ? 'פעיל במכשיר הזה. כל משימה תתריע לפי התזכורת שלה (ברירת מחדל: ' + esc(remindLabel(S.remindDefault)) + '), גם כשהאפליקציה סגורה.' : 'תקבלו התראה לפני כל משימה, גם כשהאפליקציה סגורה.'}</p>
    <div class="list">${on ? '<button class="btn" id="pTest">שלח התראת בדיקה</button><button class="btn" id="pOff">כבה התראות במכשיר הזה</button>' : '<button class="btn pri" id="pOn">הפעל התראות</button>'}</div><div class="vstat err" id="pErr"></div>`;
  const err = m => { $('#pErr', box).textContent = m; };
  const MSG = { need_sync: 'צריך להפעיל סנכרון קודם', unsupported: 'הדפדפן לא תומך', ios_install: 'צריך להוסיף למסך הבית קודם', denied: 'לא אישרתם התראות', no_vapid: 'השירות עוד לא מוכן, נסו שוב בעוד דקה', offline: 'אין חיבור לשרת' };
  const on_ = $('#pOn', box); if (on_) on_.onclick = async () => { on_.disabled = true; try { await enablePush(); toast('ההתראות פעילות'); } catch (e) { err(MSG[e.message] || 'לא הצלחנו להפעיל התראות'); } drawPush(sheet); };
  const t_ = $('#pTest', box); if (t_) t_.onclick = async () => { await sendTestPush(); toast('תגיע התראה בעוד כדקה. אפשר לסגור את האפליקציה'); };
  const o_ = $('#pOff', box); if (o_) o_.onclick = async () => { await disablePush(); toast('ההתראות כובו במכשיר הזה'); drawPush(sheet); };
}


/* ═════════ הדברים הקטנים: מסך פתיחה ותבנית, ותזכורת גיבוי ═════════ */
async function exportBackup() {
  const how = await deliverFile(`agenda-backup-${todayKey()}.json`, 'application/json', JSON.stringify(S, null, 1));
  if (how !== 'cancelled') { try { localStorage.setItem('agenda.lastExport', String(Date.now())); } catch (e) {} }
  if (how === 'download') toast('הגיבוי ירד למכשיר');
}
function maybeBackupNudge() {                              // בלי סנכרון: פעם ביום, אם עבר שבוע מהגיבוי האחרון
  if (DEMO || sync.key || S.tasks.length < 5) return;
  try {
    const last = +localStorage.getItem('agenda.lastExport') || 0, today = todayKey();
    if (localStorage.getItem('agenda.backupNag') === today || Date.now() - last < 7 * 86400000) return;
    localStorage.setItem('agenda.backupNag', today);
    const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
    setTimeout(() => toast(days === null ? 'הנתונים שמורים רק במכשיר הזה. כדאי לגבות או להפעיל סנכרון.' : `לא גיבית כבר ${days} ימים. הנתונים שמורים רק במכשיר הזה.`, 'גבה', exportBackup), 2500);
  } catch (e) {}
}
function loadTemplate() {                                  // שבוע לימודים רגיל. כל פריט אפשר לערוך או למחוק
  const id = c => (S.cats.find(x => x.id === c) ? c : S.cats[0].id), d = keyOf(startOfWeek(new Date()));
  const mk = (title, c, start, end, repeat, routine) => ({ id: uid(), title, cat: id(c), start, end, date: d, notes: '', done: {}, skip: [], repeat, routine: !!routine });
  S.tasks.push(
    mk('בית ספר', 'school', '08:00', '14:30', { type: 'weekly', days: [0, 1, 2, 3, 4] }),
    mk('שיעורי בית', 'school', '16:00', '17:15', { type: 'weekly', days: [0, 1, 2, 3] }),
    mk('אימון', 'gym', '17:30', '19:00', { type: 'weekly', days: [0, 2, 4] }),
    mk('מתיחות התאוששות', 'recovery', '21:45', '22:15', { type: 'daily', days: [] }),
    mk('ארוחת ערב', 'personal', '19:15', '19:45', { type: 'daily', days: [] }, true),
    mk('שינה', 'recovery', '23:00', '06:30', { type: 'daily', days: [] }, true));
  save(); render({ scroll: true }); toast('התבנית נטענה. אפשר לערוך או למחוק כל פריט');
}
function maybeOnboard() {
  if (DEMO || S.tasks.length || S.inbox.length || sync.key) return;
  try { if (localStorage.getItem('agenda.onboarded')) return; } catch (e) { return; }
  const mark = () => { try { localStorage.setItem('agenda.onboarded', '1'); } catch (e) {} };
  const { sheet, close } = openSheet(`
    <div class="shh"><div class="grab"></div></div>
    <div class="onb">
      <h2>ברוכים הבאים ל״סדר יום״</h2>
      <ul>
        <li><b>הוספה:</b> נוגעים ב־+ או במיקרופון ואומרים, למשל: "אימון מחר בחמש וחצי".</li>
        <li><b>תזוזה:</b> לחיצה ארוכה על בלוק מרימה אותו, וגוררים לשעה אחרת או למשך אחר.</li>
        <li><b>מה שלא הספקתם:</b> מחכה לכם בתיבה למעלה, ואפשר להעביר אותו להיום.</li>
        <li><b>בכל מכשיר:</b> בהגדרות מפעילים סנכרון ומקבלים גם התראות.</li>
      </ul>
      <div class="dels">
        <button type="button" class="btn pri" id="oTpl">התחל עם שבוע לימודים לדוגמה</button>
        <button type="button" class="btn" id="oEmpty">התחל ריק</button>
        <button type="button" class="btn" id="oJoin">יש לי מפתח סנכרון ממכשיר אחר</button>
      </div>
    </div>`, mark);
  $('#oTpl', sheet).onclick = () => { close(); setTimeout(loadTemplate, 250); };
  $('#oEmpty', sheet).onclick = close;
  $('#oJoin', sheet).onclick = () => { close(); setTimeout(openSettings, 300); };
}

function loadExamples() {
  const id = c => (S.cats.find(x => x.id === c) ? c : S.cats[0].id);
  const d = keyOf(startOfWeek(new Date()));
  const mk = (title, c, start, end, repeat) => ({ id: uid(), title, cat: id(c), start, end, date: d, notes: '', done: {}, skip: [], repeat });
  const before = S.tasks.length;
  const add = (...ts) => ts.forEach(t => { if (!S.tasks.some(x => x.title === t.title && x.start === t.start && x.end === t.end)) S.tasks.push(t); });
  add(
    mk('בית ספר', 'school', '08:00', '14:30', { type: 'weekly', days: [0, 1, 2, 3, 4] }),
    mk('שיעורי בית', 'school', '16:00', '17:15', { type: 'weekly', days: [0, 1, 2, 3] }),
    mk('אימון חדר כושר', 'gym', '17:30', '19:00', { type: 'weekly', days: [0, 2, 4] }),
    mk('זמן עם סינדי', 'cindy', '20:00', '21:30', { type: 'weekly', days: [1, 3, 5] }),
    mk('מתיחות התאוששות', 'recovery', '21:45', '22:15', { type: 'daily', days: [] })
  );
  save(); render({ scroll: true }); toast(S.tasks.length > before ? 'נוספו משימות לדוגמה — אפשר לערוך או למחוק' : 'הדוגמאות כבר קיימות');
}

/* ═════════ הפעלה ═════════ */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // מבקש מהדפדפן לא למחוק את הנתונים לבד
const UIKEY = 'agenda.ui';
let restored = false;
try {
  const u = JSON.parse(localStorage.getItem(UIKEY));
  if (u && Date.now() - u.ts < 20 * 60 * 1000 && /^\d{4}-\d\d-\d\d$/.test(u.date) && u.view === S.view) { ui.date = u.date; restored = u; }
} catch (e) {}
let uiTimer = 0;
const saveUi = () => { clearTimeout(uiTimer); uiTimer = setTimeout(() => { try { localStorage.setItem(UIKEY, JSON.stringify({ date: ui.date, view: S.view, y: window.scrollY, ts: Date.now() })); } catch (e) {} }, 250); };
addEventListener('scroll', saveUi, { passive: true });
addEventListener('pagehide', () => { try { localStorage.setItem(UIKEY, JSON.stringify({ date: ui.date, view: S.view, y: window.scrollY, ts: Date.now() })); } catch (e) {} });
snapshotShadow();
const DEMO = /*DEMO*/false;
let hadStore = false; try { hadStore = !!localStorage.getItem(STORE); } catch (e) {}
if (DEMO && !S.tasks.length && !hadStore) loadExamples();
else if (restored) { render({ scroll: true }); window.scrollTo({ top: restored.y, behavior: 'instant' }); }
else render({ scroll: true });
if (sync.key) queueSync(800);
maybeOnboard(); maybeBackupNudge();
setInterval(tickNow, 30000);
try {                                                     // טיפ חד-פעמי בנייד: איך מזיזים בלוק
  if (S.tasks.length && matchMedia('(pointer:coarse)').matches && !localStorage.getItem('agenda.tip1')) {
    localStorage.setItem('agenda.tip1', '1');
    setTimeout(() => toast('טיפ: החזיקו לחיצה על בלוק כדי להזיז או לשנות את משכו'), 1200);
  }
} catch (e) {}
let bootDay = todayKey();
function tickNow() {
  updateNowNext(); updateBadge();
  const n = $('[data-now]'); if (!n) return;
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), ppm = S.view === 'day' ? PPM() : WPPM();
  n.style.top = (TOP + m * ppm) + 'px';
  const sp = $('span', n); if (sp) sp.textContent = fmt(m);
}
document.addEventListener('visibilitychange', () => {   // חזרה לאפליקציה: בלי לצייר מחדש ובלי לקפוץ. רק אחרי חצות עוברים ליום החדש
  if (document.visibilityState !== 'visible') return;
  if (todayKey() !== bootDay) {
    const wasToday = ui.date === bootDay; bootDay = todayKey();
    if (wasToday) { ui.date = bootDay; if (!document.querySelector('.ov')) render({ scroll: true }); }
  } else tickNow();
});
/*SW*/ if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

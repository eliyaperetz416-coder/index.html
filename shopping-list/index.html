<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">הרשימה שלי</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הרשימה שלי">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<script src="js/debug.js"></script>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <p class="login-emoji">🛒</p>
    <h1 id="loginTitle">הרשימה שלי</h1>
    <p id="loginSubtitle">התחבר כדי לראות ולשתף רשימות קניות</p>
    <button class="google-btn" id="googleSignInBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.8 2.73v2.27h2.92c1.71-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.96H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.04l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      <span id="googleSignInLabel">התחבר עם Google</span>
    </button>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <header>
    <div>
      <h1 id="headerTitle" role="button" tabindex="0">הרשימה שלי 🛒</h1>
      <p id="stats">0 פריטים</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="listPickerBtn" aria-label="רשימות">📋</button>
      <button class="icon-btn" id="settingsBtn" aria-label="הגדרות">⚙️</button>
    </div>
  </header>

  <div class="offline-bar" id="offlineBar" role="status" hidden></div>

  <div class="welcome" id="welcomeScreen">
    <p class="login-emoji">🛒</p>
    <h2 id="welcomeTitle">ברוכים הבאים 👋</h2>
    <p class="welcome-sub" id="welcomeSubtitle"></p>

    <div class="setting-group">
      <label id="welcomeCreateLabel">רשימה חדשה</label>
      <div class="inline-form-row">
        <input type="text" id="welcomeNewListInput" maxlength="60" autocomplete="off" />
        <button class="inline-form-btn" id="welcomeCreateBtn" aria-label="+">+</button>
      </div>
      <p class="form-error" id="welcomeCreateError" role="alert"></p>
    </div>

    <div class="setting-group">
      <label id="welcomeJoinLabel">הצטרף עם קוד</label>
      <div class="inline-form-row">
        <input type="text" id="welcomeJoinInput" maxlength="12" autocapitalize="characters" autocomplete="off" />
        <button class="inline-form-btn" id="welcomeJoinBtn" aria-label="↵">↵</button>
      </div>
      <p class="form-error" id="welcomeJoinError" role="alert"></p>
    </div>
  </div>

  <div class="welcome" id="loadErrorScreen">
    <p class="login-emoji">📡</p>
    <p class="welcome-sub" id="loadErrorText"></p>
    <button class="retry-btn" id="retryLoadBtn">נסו שוב</button>
  </div>

  <div class="screen active" id="listScreen">
    <div class="add-row">
      <div class="add-field">
        <input type="text" id="itemInput" autocomplete="off" enterkeyhint="done"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestBox" />
        <ul class="suggest-box" id="suggestBox" role="listbox" hidden></ul>
      </div>
      <button id="addBtn" aria-label="הוסף">+</button>
    </div>

    <div class="list-toolbar">
      <button type="button" class="chip-btn" id="shopModeBtn" aria-pressed="false">🛍️ <span id="shopModeLabel">מצב קנייה</span></button>
    </div>

    <div class="list" id="list"></div>

    <button type="button" class="clear-bought" id="clearBoughtBtn" hidden></button>
  </div>

  <div class="screen" id="statsScreen">
    <div class="segmented stats-period" id="statsPeriod" role="radiogroup">
      <button type="button" role="radio" data-period="week" aria-checked="true" id="periodWeekBtn">שבוע</button>
      <button type="button" role="radio" data-period="month" aria-checked="false" id="periodMonthBtn">חודש</button>
    </div>

    <div class="suggestions-card" id="suggestionsCard" style="display:none;">
      <p class="suggestions-title" id="suggestionsTitle">מוסיפים מהיר?</p>
      <div class="suggestions-list" id="suggestionsList"></div>
    </div>

    <div class="stats-summary-grid">
      <div class="stats-summary-card">
        <p class="stats-summary-label" id="statsWeekTotalLabel">פריטים השבוע</p>
        <p class="stats-summary-value" id="statsWeekTotalValue">0</p>
      </div>
      <div class="stats-summary-card">
        <p class="stats-summary-label" id="statsTopCategoryLabel">קטגוריה מובילה</p>
        <p class="stats-summary-value" id="statsTopCategoryValue">–</p>
      </div>
    </div>

    <div class="stats-compare-box" id="statsCompareBox"></div>

    <div class="stats-chart-card">
      <p class="stats-chart-title" id="statsChartTitle">לפי קטגוריה השבוע</p>
      <div id="statsChart"></div>
    </div>

    <div class="stats-chart-card stats-top-card">
      <p class="stats-chart-title" id="statsTopItemsTitle">הפריטים הנפוצים</p>
      <ol class="top-items" id="statsTopItems"></ol>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-tab active" id="navListBtn">📝 <span id="navListLabel">רשימה</span></button>
    <button class="nav-tab" id="navStatsBtn">📊 <span id="navStatsLabel">סטטיסטיקה</span></button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastText"></span>
  <button type="button" id="toastAction" hidden></button>
</div>

<div class="settings-overlay" id="listPickerOverlay">
  <div class="settings-panel">
    <h2 id="listPickerTitle">הרשימות שלי</h2>

    <div class="list-picker-items" id="listPickerItems"></div>

    <button class="secondary-btn wide" id="manageListBtn">ניהול הרשימה</button>

    <div class="setting-group">
      <label id="createListLabel">רשימה חדשה</label>
      <div class="inline-form-row">
        <input type="text" id="newListNameInput" maxlength="60" autocomplete="off" />
        <button class="inline-form-btn" id="createListBtn" aria-label="+">+</button>
      </div>
      <p class="form-error" id="createListError" role="alert"></p>
    </div>

    <div class="setting-group">
      <label id="joinListLabel">הצטרף עם קוד</label>
      <div class="inline-form-row">
        <input type="text" id="joinCodeInput" maxlength="12" autocapitalize="characters" autocomplete="off" />
        <button class="inline-form-btn" id="joinListBtn" aria-label="↵">↵</button>
      </div>
      <p class="form-error" id="joinListError"></p>
    </div>

    <div class="setting-group" id="signedInAsGroup">
      <label id="signedInAsLabel">מחובר כ</label>
      <div class="signed-in-row">
        <span id="signedInEmail"></span>
        <button class="text-link-btn" id="signOutBtn">התנתק</button>
      </div>
    </div>

    <button class="close-btn" id="closeListPickerBtn">סגור</button>
  </div>
</div>

<div class="settings-overlay" id="itemEditOverlay">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="itemEditTitle">
    <h2 id="itemEditTitle">עריכת פריט</h2>

    <div class="setting-group">
      <label id="editNameLabel" for="editName">שם</label>
      <input class="field" type="text" id="editName" maxlength="200" autocomplete="off" />
    </div>
    <div class="setting-group">
      <label id="editQuantityLabel" for="editQuantity">כמות</label>
      <input class="field" type="text" id="editQuantity" maxlength="40" autocomplete="off" />
    </div>
    <div class="setting-group">
      <label id="editNoteLabel" for="editNote">הערה</label>
      <input class="field" type="text" id="editNote" maxlength="200" autocomplete="off" />
    </div>
    <div class="setting-group">
      <label id="editCategoryLabel" for="editCategory">קטגוריה</label>
      <select id="editCategory"></select>
    </div>
    <div class="setting-group">
      <label id="editUrgencyLabel">דחיפות</label>
      <div class="segmented" id="editUrgency" role="radiogroup" aria-labelledby="editUrgencyLabel"></div>
    </div>

    <div class="sheet-actions">
      <button class="primary-btn" id="editSaveBtn">שמור</button>
      <button class="secondary-btn" id="editCancelBtn">ביטול</button>
    </div>
    <button class="text-link-btn danger" id="editDeleteBtn">מחק</button>
  </div>
</div>

<div class="settings-overlay" id="listManageOverlay">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="listManageTitle">
    <h2 id="listManageTitle">ניהול הרשימה</h2>

    <div class="setting-group">
      <label id="manageNameLabel" for="manageName">שם הרשימה</label>
      <div class="inline-form-row">
        <input type="text" id="manageName" maxlength="100" autocomplete="off" />
        <button class="inline-form-btn" id="manageRenameBtn" aria-label="✓">✓</button>
      </div>
    </div>

    <div class="setting-group">
      <label id="manageCodeLabel">קוד הצטרפות</label>
      <div class="code-box" id="manageCode" dir="ltr"></div>
      <div class="sheet-actions">
        <button class="secondary-btn" id="copyCodeBtn">העתק קוד</button>
        <button class="secondary-btn" id="copyLinkBtn">העתק קישור</button>
        <button class="primary-btn" id="shareBtn">שתף</button>
      </div>
      <button class="text-link-btn" id="newCodeBtn">צור קוד חדש</button>
    </div>

    <div class="setting-group">
      <label id="manageMembersLabel">חברים</label>
      <ul class="member-list" id="memberList"></ul>
    </div>

    <p class="hint" id="ownerLeaveHint" hidden></p>
    <button class="text-link-btn danger" id="leaveListBtn">עזוב את הרשימה</button>
    <button class="text-link-btn danger" id="deleteListBtn">מחק את הרשימה</button>
    <button class="close-btn" id="closeManageBtn">סגור</button>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h2 id="settingsTitle">הגדרות</h2>

    <div class="setting-group">
      <label id="langLabel">שפה</label>
      <select id="langSelect">
        <option value="he">עברית</option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ru">Русский</option>
        <option value="pt">Português</option>
        <option value="zh">中文</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>

    <div class="setting-group">
      <label id="themeLabel">ערכת נושא</label>
      <div class="theme-toggle">
        <button class="theme-option" id="darkOption">🌙 <span id="darkLabel">כהה</span></button>
        <button class="theme-option" id="lightOption">☀️ <span id="lightLabel">בהיר</span></button>
      </div>
    </div>

    <button class="close-btn" id="closeSettingsBtn">סגור</button>
  </div>
</div>

<div class="settings-overlay confirm-overlay" id="confirmOverlay">
  <div class="settings-panel" role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
    <p class="confirm-text" id="confirmText"></p>
    <div class="sheet-actions">
      <button class="primary-btn" id="confirmOk"></button>
      <button class="secondary-btn" id="confirmCancel"></button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">הרשימה שלי</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הרשימה שלי">
<style>
  :root {
    --coral: #ff6b6b;
    --teal: #4ecdc4;
    --yellow: #ffd166;
    --purple: #a78bfa;
    --pink: #f472b6;
    --radius: 14px;
  }

  /* Dark theme (default) */
  html[data-theme="dark"] {
    --bg: #1a1a2e;
    --surface: #26264a;
    --surface-dim: #20203a;
    --text: #ffffff;
    --text-dim: #8b8ba7;
  }

  /* Light theme */
  html[data-theme="light"] {
    --bg: #f4f4fb;
    --surface: #ffffff;
    --surface-dim: #e9e9f5;
    --text: #1a1a2e;
    --text-dim: #6b6b8a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .app {
    width: 100%;
    max-width: 420px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--surface);
    border: none;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .icon-btn:active { transform: scale(0.94); }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .add-row input {
    flex: 1;
    height: 50px;
    border-radius: var(--radius);
    border: none;
    background: var(--surface);
    color: var(--text);
    padding: 0 16px;
    font-size: 15px;
    outline: none;
  }

  .add-row input::placeholder { color: var(--text-dim); }
  .add-row input:focus { box-shadow: 0 0 0 2px var(--teal); }

  .add-row button {
    width: 50px;
    height: 50px;
    border-radius: var(--radius);
    border: none;
    background: var(--coral);
    color: #1a1a2e;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .add-row button:active { transform: scale(0.92); }

  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 14px;
    background: var(--surface);
    border-radius: var(--radius);
    border-inline-start: 3px solid var(--cat-color, var(--purple));
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .item.bought {
    background: var(--surface-dim);
    opacity: 0.6;
    border-inline-start-color: transparent;
  }

  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 8px;
    border: 2px solid var(--cat-color, var(--purple));
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    transition: background 0.15s ease;
  }

  .item.bought .checkbox {
    background: var(--coral);
    border-color: var(--coral);
  }

  .checkbox svg { display: none; width: 12px; height: 12px; }
  .item.bought .checkbox svg { display: block; }

  .item-name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }

  .item.bought .item-name {
    text-decoration: line-through;
    color: var(--text-dim);
  }

  .item-cat {
    font-size: 11px;
    font-weight: 600;
    color: #1a1a2e;
    background: var(--cat-color, var(--purple));
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .item.bought .item-cat { display: none; }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .delete-btn:hover { color: var(--coral); }

  /* Urgency indicator (small colored square) and its picker menu */
  .urgency-square {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
    background: var(--urgency-color, transparent);
  }

  .urgency-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .urgency-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .urgency-btn:hover { color: var(--text); }

  .urgency-menu {
    position: absolute;
    top: 100%;
    inset-inline-start: 0;
    margin-top: 4px;
    background: var(--surface-dim);
    border-radius: 12px;
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 5;
    min-width: 140px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }

  .urgency-menu.show { display: flex; }

  .urgency-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    text-align: start;
  }

  .urgency-option:hover { background: var(--surface); }

  .urgency-option .dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }

  .category-group-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin: 16px 0 8px;
    padding: 0 2px;
  }

  .category-group-title:first-child { margin-top: 0; }

  .bought-group-title {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--surface-dim);
    opacity: 0.7;
  }

  /* Settings panel */
  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }

  .settings-overlay.show { display: flex; }

  .settings-panel {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 20px;
    animation: slideUp 0.2s ease;
    max-height: 85vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .settings-panel h2 {
    font-size: 17px;
    margin-bottom: 16px;
  }

  .setting-group {
    margin-bottom: 20px;
  }

  .setting-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .setting-group select {
    width: 100%;
    height: 46px;
    border-radius: 12px;
    border: none;
    background: var(--surface-dim);
    color: var(--text);
    padding: 0 14px;
    font-size: 14px;
    outline: none;
  }

  .theme-toggle {
    display: flex;
    gap: 8px;
  }

  .theme-option {
    flex: 1;
    height: 46px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: var(--surface-dim);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .theme-option.active {
    border-color: var(--teal);
  }

  .soon-box {
    background: var(--surface-dim);
    border-radius: 12px;
    padding: 14px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .settings-panel .close-btn {
    width: 100%;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: var(--surface-dim);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  /* Screens */
  .screen { display: none; }
  .screen.active { display: block; }

  /* Bottom nav (List / Stats tabs) */
  .bottom-nav {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    background: var(--surface);
    border-radius: 16px;
    padding: 6px;
    position: sticky;
    bottom: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  .nav-tab {
    flex: 1;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-tab.active {
    background: linear-gradient(135deg, var(--coral), var(--yellow));
    color: #1a1a2e;
  }

  /* Stats screen */
  .stats-summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .stats-summary-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px;
  }

  .stats-summary-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .stats-summary-value {
    font-size: 22px;
    font-weight: 700;
  }

  .stats-compare-box {
    background: var(--bg-accent-muted, var(--surface));
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .stats-chart-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
  }

  .stats-chart-title {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .stats-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .stats-bar-row:last-child { margin-bottom: 0; }

  .stats-bar-label {
    font-size: 12px;
    width: 84px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stats-bar-track {
    flex: 1;
    height: 14px;
    background: var(--surface-dim);
    border-radius: 8px;
    overflow: hidden;
  }

  .stats-bar-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.3s ease;
  }

  .stats-bar-count {
    font-size: 12px;
    color: var(--text-dim);
    width: 20px;
    text-align: end;
    flex-shrink: 0;
  }

  .stats-empty {
    text-align: center;
    padding: 30px 16px;
    color: var(--text-dim);
    font-size: 13px;
  }

  .suggestions-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
  }

  .suggestions-title {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .suggestions-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .suggestion-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 20px;
    border: none;
    background: var(--surface-dim);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }

  .suggestion-chip:active { transform: scale(0.95); }
  .suggestion-chip.added { opacity: 0.4; pointer-events: none; }

  .suggestion-chip .plus { color: var(--teal); font-weight: 700; }

  /* Login screen */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-box {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }

  .login-emoji { font-size: 48px; margin-bottom: 12px; }

  .login-box h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }

  .login-box p#loginSubtitle {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 24px;
  }

  .google-btn {
    width: 100%;
    height: 50px;
    border-radius: 14px;
    border: none;
    background: #fff;
    color: #1a1a2e;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* Header actions (list picker + settings) */
  .header-actions {
    display: flex;
    gap: 8px;
  }

  /* List picker */
  .list-picker-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }

  .list-picker-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: var(--surface-dim);
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
  }

  .list-picker-item.active { border-color: var(--teal); }

  .list-picker-item .list-name { font-size: 14px; font-weight: 600; }
  .list-picker-item .list-code { font-size: 11px; color: var(--text-dim); }

  .inline-form-row {
    display: flex;
    gap: 8px;
  }

  .inline-form-row input {
    flex: 1;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: var(--surface-dim);
    color: var(--text);
    padding: 0 14px;
    font-size: 14px;
    outline: none;
  }

  .inline-form-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: var(--teal);
    color: #1a1a2e;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }

  .form-error {
    font-size: 12px;
    color: var(--coral);
    margin-top: 6px;
    min-height: 14px;
  }

  .signed-in-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-dim);
  }

  .text-link-btn {
    background: none;
    border: none;
    color: var(--coral);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }

</style>
</head>
<body>

<script>
  // TEMP DEBUG: catch any JS error anywhere on the page and show it on screen,
  // since there's no devtools access on a phone. Remove once things work.
  window.addEventListener('error', function (e) {
    var box = document.getElementById('debugErrorBox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'debugErrorBox';
      box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff3333;color:#fff;font-size:12px;padding:10px;z-index:99999;direction:ltr;text-align:left;word-break:break-word;';
      document.body.appendChild(box);
    }
    box.textContent = 'JS ERROR: ' + e.message + ' (line ' + e.lineno + ')';
  });
</script>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <p class="login-emoji">🛒</p>
    <h1 id="loginTitle">הרשימה שלי</h1>
    <p id="loginSubtitle">התחבר כדי לראות ולשתף רשימות קניות</p>
    <button class="google-btn" id="googleSignInBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.8 2.73v2.27h2.92c1.71-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.96H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.04l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      <span id="googleSignInLabel">התחבר עם Google</span>
    </button>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <header>
    <div>
      <h1 id="headerTitle">הרשימה שלי 🛒</h1>
      <p id="stats">0 פריטים</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="listPickerBtn" aria-label="רשימות">📋</button>
      <button class="icon-btn" id="settingsBtn" aria-label="הגדרות">⚙️</button>
    </div>
  </header>

  <div class="screen active" id="listScreen">
    <div class="add-row">
      <input type="text" id="itemInput" />
      <button id="addBtn" aria-label="הוסף">+</button>
    </div>

    <div class="list" id="list"></div>
  </div>

  <div class="screen" id="statsScreen">
    <div class="suggestions-card" id="suggestionsCard" style="display:none;">
      <p class="suggestions-title" id="suggestionsTitle">מוסיפים מהיר?</p>
      <div class="suggestions-list" id="suggestionsList"></div>
    </div>

    <div class="stats-summary-grid">
      <div class="stats-summary-card">
        <p class="stats-summary-label" id="statsWeekTotalLabel">פריטים השבוע</p>
        <p class="stats-summary-value" id="statsWeekTotalValue">0</p>
      </div>
      <div class="stats-summary-card">
        <p class="stats-summary-label" id="statsTopCategoryLabel">קטגוריה מובילה</p>
        <p class="stats-summary-value" id="statsTopCategoryValue">–</p>
      </div>
    </div>

    <div class="stats-compare-box" id="statsCompareBox"></div>

    <div class="stats-chart-card">
      <p class="stats-chart-title" id="statsChartTitle">לפי קטגוריה השבוע</p>
      <div id="statsChart"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-tab active" id="navListBtn">📝 <span id="navListLabel">רשימה</span></button>
    <button class="nav-tab" id="navStatsBtn">📊 <span id="navStatsLabel">סטטיסטיקה</span></button>
  </div>
</div>

<div class="settings-overlay" id="listPickerOverlay">
  <div class="settings-panel">
    <h2 id="listPickerTitle">הרשימות שלי</h2>

    <div class="list-picker-items" id="listPickerItems"></div>

    <div class="setting-group">
      <label id="createListLabel">רשימה חדשה</label>
      <div class="inline-form-row">
        <input type="text" id="newListNameInput" />
        <button class="inline-form-btn" id="createListBtn">+</button>
      </div>
    </div>

    <div class="setting-group">
      <label id="joinListLabel">הצטרף עם קוד</label>
      <div class="inline-form-row">
        <input type="text" id="joinCodeInput" />
        <button class="inline-form-btn" id="joinListBtn">↵</button>
      </div>
      <p class="form-error" id="joinListError"></p>
    </div>

    <div class="setting-group" id="signedInAsGroup">
      <label id="signedInAsLabel">מחובר כ</label>
      <div class="signed-in-row">
        <span id="signedInEmail"></span>
        <button class="text-link-btn" id="signOutBtn">התנתק</button>
      </div>
    </div>

    <button class="close-btn" id="closeListPickerBtn">סגור</button>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h2 id="settingsTitle">הגדרות</h2>

    <div class="setting-group">
      <label id="langLabel">שפה</label>
      <select id="langSelect">
        <option value="he">עברית</option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>

<script type="module">
  // ============================================================
  // FIREBASE SETUP — shared lists (auth + realtime sync)
  // ============================================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
    getRedirectResult, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot,
    collection, query, where, arrayUnion, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBL3DPWGO3PIdbGxH8QlvFzx6tGaC2Z3Bk",
    authDomain: "shopping-list-app-2fa25.firebaseapp.com",
    projectId: "shopping-list-app-2fa25",
    storageBucket: "shopping-list-app-2fa25.firebasestorage.app",
    messagingSenderId: "307109384624",
    appId: "1:307109384624:web:d00f77a99b119e581cc675",
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  const googleProvider = new GoogleAuthProvider();

  // Mobile browsers (especially Safari on iOS) frequently fail to complete
  // sign-in inside a popup window — the popup opens but the Google button
  // inside it doesn't respond. Redirect-based sign-in (leaving the page,
  // signing in, then returning) is far more reliable there.
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  function signInWithGoogle() {
    return isMobile
      ? signInWithRedirect(auth, googleProvider)
      : signInWithPopup(auth, googleProvider);
  }

  // On page load, check whether we just came back from a redirect-based
  // sign-in (mobile flow) so onAuthChange picks up the signed-in user.
  getRedirectResult(auth).catch(err => {
    console.error('Redirect sign-in failed:', err);
    window.dispatchEvent(new CustomEvent('firebase-auth-error', { detail: err }));
  });

  // Expose what the rest of the (non-module) app script needs, via a small bridge object.
  window.FB = {
    auth, db, doc, setDoc, getDoc, updateDoc, onSnapshot,
    collection, query, where, arrayUnion, serverTimestamp,
    signInWithGoogle,
    signOutUser: () => signOut(auth),
    onAuthChange: (cb) => onAuthStateChanged(auth, cb),
  };

  // Let the main script know Firebase is ready to use
  window.dispatchEvent(new Event('firebase-ready'));
</script>

  // For languages without a curated keyword list, fall back to English keywords (still functional, just less accurate)

  // The three urgency levels a user can assign to an item (colors only — labels are translated)
  const URGENCY_LEVELS = {
    high: { color: '#ff6b6b' },   // red — urgent
    medium: { color: '#ffd166' }, // yellow — moderate
    low: { color: '#4ade80' },    // green — plenty left
  };

  // ============================================================
  // STATE
  // ============================================================
  let currentLang = localStorage.getItem('appLang') || 'he';
  let currentTheme = localStorage.getItem('appTheme') || 'dark';

  // Shared-list state (backed by Firestore once signed in)
  let currentUser = null;       // Firebase auth user object
  let myLists = [];             // [{id, name, code, ownerUid, members}]
  let activeListId = localStorage.getItem('activeListId') || null;
  let items = [];               // items of the currently active list (local mirror of Firestore)
  let purchaseHistory = [];     // purchase history of the currently active list
  let unsubscribeActiveList = null; // Firestore onSnapshot cleanup function
  let suppressNextSnapshot = false; // avoids re-rendering from our own writes echoing back

  function t() { return TRANSLATIONS[currentLang]; }

  // Push the current items + purchaseHistory to Firestore for the active list.
  // (Debounced slightly isn't necessary here since writes are small and infrequent —
  // one write per user action — but we guard against saving with no active list.)
  async function save() {
    if (!activeListId || !window.FB) return;
    suppressNextSnapshot = true;
    try {
      await window.FB.updateDoc(window.FB.doc(window.FB.db, 'lists', activeListId), {
        items,
        purchaseHistory,
      });
    } catch (err) {
      console.error('Failed to save list to Firestore:', err);
    }
  }

  // ============================================================
  // CATEGORY GUESSING
  // ============================================================
  function guessCategory(name) {
    const lower = name.trim().toLowerCase();
    const keywordSet = CATEGORY_KEYWORDS[currentLang] || CATEGORY_KEYWORDS.en;
    const catColors = {
      dairy: 'var(--teal)', bakery: 'var(--yellow)', veg: '#4ade80', fruit: '#fb923c',
      meat: 'var(--coral)', clean: 'var(--purple)',
      frozen: '#60a5fa', snacks: '#f472b6', drinks: '#38bdf8', baking: '#d97706',
    };

    for (const key in keywordSet) {
      if (keywordSet[key].some(k => lower.includes(k))) {
        return { key, name: t().categories[key], color: catColors[key] };
      }
    }
    return { key: 'other', name: t().categories.other, color: 'var(--pink)' };
  }

  // ============================================================
  // RENDERING
  // ============================================================
  const listEl = document.getElementById('list');
  const statsEl = document.getElementById('stats');

  // Fixed display order for category groups — categories not in this list (shouldn't
  // happen, but as a safety net) fall back to appearing after all of these.
  const CATEGORY_ORDER = ['dairy', 'bakery', 'veg', 'fruit', 'meat', 'frozen', 'snacks', 'drinks', 'baking', 'clean', 'other'];

  function renderItemCard(item) {
    const catInfo = { name: t().categories[item.catKey] || item.catName, color: item.catColor };
    const el = document.createElement('div');
    el.className = 'item' + (item.bought ? ' bought' : '');
    el.style.setProperty('--cat-color', catInfo.color);
    const urgencyColor = URGENCY_LEVELS[item.urgency]?.color || '';
    el.innerHTML = `
      <button class="checkbox" data-id="${item.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
      </button>
      <span class="item-name">${escapeHtml(item.name)}</span>
      ${urgencyColor ? `<span class="urgency-square" style="--urgency-color:${urgencyColor}"></span>` : ''}
      <span class="item-cat">${catInfo.name}</span>
      <div class="urgency-wrap">
        <button class="urgency-btn" data-id="${item.id}">⋮</button>
        <div class="urgency-menu" data-menu-for="${item.id}">
          ${Object.entries(URGENCY_LEVELS).map(([key, level]) => `
            <button class="urgency-option" data-id="${item.id}" data-urgency="${key}">
              <span class="dot" style="background:${level.color}"></span>${t().urgencyLabels[key]}
            </button>
          `).join('')}
        </div>
      </div>
      <button class="delete-btn" data-id="${item.id}">✕</button>
    `;
    return el;
  }

  function render() {
    listEl.innerHTML = '';

    if (items.length === 0) {
      listEl.innerHTML = `<div class="empty-state">${t().emptyState}</div>`;
      statsEl.textContent = t().statsFn(0, 0);
      return;
    }

    const unbought = items.filter(i => !i.bought);
    const bought = items.filter(i => i.bought);

    // Sort unbought items by CATEGORY_ORDER (grouped visually via each item's own
    // category tag — no separate group headers), so items of the same category still
    // end up next to each other without an extra heading line.
    const sortedUnbought = [...unbought].sort((a, b) => {
      const ai = CATEGORY_ORDER.indexOf(a.catKey || 'other');
      const bi = CATEGORY_ORDER.indexOf(b.catKey || 'other');
      return (ai === -1 ? CATEGORY_ORDER.length : ai) - (bi === -1 ? CATEGORY_ORDER.length : bi);
    });

    sortedUnbought.forEach(item => listEl.appendChild(renderItemCard(item)));

    if (bought.length > 0) {
      const boughtHeader = document.createElement('div');
      boughtHeader.className = 'category-group-title bought-group-title';
      boughtHeader.textContent = `${t().boughtSectionTitle} · ${bought.length}`;
      listEl.appendChild(boughtHeader);
      bought.forEach(item => listEl.appendChild(renderItemCard(item)));
    }

    const boughtCount = bought.length;
    statsEl.textContent = t().statsFn(items.length, boughtCount);
  }


  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ============================================================
  // ACTIONS
  // ============================================================
  function addItem(name) {
    if (!name.trim()) return;
    const cat = guessCategory(name);
    items.push({
      id: Date.now().toString(),
      name: name.trim(),
      bought: false,
      catKey: cat.key,
      catName: cat.name,
      catColor: cat.color,
    });
    save();
    render();
  }

  function toggleBought(id) {
    const item = items.find(i => i.id === id);
    if (item) {
      item.bought = !item.bought;
      if (item.bought) {
        item.boughtAt = Date.now();
        logPurchase(item);
      } else {
        item.boughtAt = null;
      }
    }
    save();
    render();
  }

  // Purchase history: a separate, append-only log of {name, catKey, catColor, timestamp}
  // for every item ever marked bought, stored alongside items in the same list document.
  // Kept even if the item is later deleted from the active list, so weekly stats stay
  // accurate. Capped to the most recent 500 entries.
  function logPurchase(item) {
    purchaseHistory.push({
      name: item.name,
      catKey: item.catKey,
      catColor: item.catColor,
      timestamp: item.boughtAt,
    });
    if (purchaseHistory.length > 500) purchaseHistory = purchaseHistory.slice(-500);
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  const itemInput = document.getElementById('itemInput');
  const addBtn = document.getElementById('addBtn');

  addBtn.addEventListener('click', () => {
    addItem(itemInput.value);
    itemInput.value = '';
    itemInput.focus();
  });

  itemInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      addItem(itemInput.value);
      itemInput.value = '';
    }
  });

  listEl.addEventListener('click', (e) => {
    const checkboxBtn = e.target.closest('.checkbox');
    const deleteBtn = e.target.closest('.delete-btn');
    const urgencyBtn = e.target.closest('.urgency-btn');
    const urgencyOption = e.target.closest('.urgency-option');

    if (checkboxBtn) toggleBought(checkboxBtn.dataset.id);
    if (deleteBtn) deleteItem(deleteBtn.dataset.id);

    if (urgencyOption) {
      // Handle the option click first (it's inside the button, so it would
      // otherwise also trigger the toggle-open logic below)
      setUrgency(urgencyOption.dataset.id, urgencyOption.dataset.urgency);
      return;
    }

    if (urgencyBtn) {
      const menu = urgencyBtn.closest('.urgency-wrap').querySelector('.urgency-menu');
      const wasOpen = menu.classList.contains('show');
      // Close any other open menu, then toggle this one
      document.querySelectorAll('.urgency-menu.show').forEach(m => m.classList.remove('show'));
      if (!wasOpen) menu.classList.add('show');
    }
  });

  // Clicking anywhere outside an urgency menu closes it
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.urgency-btn')) {
      document.querySelectorAll('.urgency-menu.show').forEach(m => m.classList.remove('show'));
    }
  });

  function setUrgency(id, urgency) {
    const item = items.find(i => i.id === id);
    if (item) item.urgency = urgency;
    save();
    render();
  }

  // ============================================================
  // SETTINGS PANEL: language + theme
  // ============================================================
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');
  const langSelect = document.getElementById('langSelect');
  const darkOption = document.getElementById('darkOption');
  const lightOption = document.getElementById('lightOption');

  settingsBtn.addEventListener('click', () => settingsOverlay.classList.add('show'));
  closeSettingsBtn.addEventListener('click', () => settingsOverlay.classList.remove('show'));
  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) settingsOverlay.classList.remove('show');
  });

  langSelect.addEventListener('change', () => {
    currentLang = langSelect.value;
    localStorage.setItem('appLang', currentLang);
    applyLanguage();
  });

  darkOption.addEventListener('click', () => setTheme('dark'));
  lightOption.addEventListener('click', () => setTheme('light'));

  function setTheme(theme) {
    currentTheme = theme;
    localStorage.setItem('appTheme', theme);
    applyTheme();
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', currentTheme);
    darkOption.classList.toggle('active', currentTheme === 'dark');
    lightOption.classList.toggle('active', currentTheme === 'light');
  }

  function applyLanguage() {
    const dict = t();
    document.documentElement.setAttribute('lang', currentLang);
    document.documentElement.setAttribute('dir', dict.dir);
    document.getElementById('pageTitle').textContent = dict.pageTitle;
    document.getElementById('headerTitle').textContent = dict.headerTitle;
    itemInput.placeholder = dict.itemPlaceholder;
    document.getElementById('settingsTitle').textContent = dict.settingsTitle;
    document.getElementById('langLabel').textContent = dict.langLabel;
    document.getElementById('themeLabel').textContent = dict.themeLabel;
    document.getElementById('darkLabel').textContent = dict.dark;
    document.getElementById('lightLabel').textContent = dict.light;
    document.getElementById('closeSettingsBtn').textContent = dict.close;
    document.getElementById('navListLabel').textContent = dict.navList;
    document.getElementById('navStatsLabel').textContent = dict.navStats;
    document.getElementById('statsWeekTotalLabel').textContent = dict.statsWeekTotal;
    document.getElementById('statsTopCategoryLabel').textContent = dict.statsTopCategory;
    document.getElementById('statsChartTitle').textContent = dict.statsChartTitle;
    document.getElementById('suggestionsTitle').textContent = dict.suggestionsTitle;
    document.getElementById('loginTitle').textContent = dict.loginTitle;
    document.getElementById('loginSubtitle').textContent = dict.loginSubtitle;
    document.getElementById('googleSignInLabel').textContent = dict.googleSignInLabel;
    document.getElementById('listPickerTitle').textContent = dict.listPickerTitle;
    document.getElementById('createListLabel').textContent = dict.createListLabel;
    document.getElementById('joinListLabel').textContent = dict.joinListLabel;
    document.getElementById('signedInAsLabel').textContent = dict.signedInAsLabel;
    document.getElementById('signOutBtn').textContent = dict.signOutLabel;
    newListNameInput.placeholder = dict.createListLabel;
    joinCodeInput.placeholder = dict.joinCodeLabel;
    langSelect.value = currentLang;
    render(); // re-render list + stats + category names in new language
    renderStats(); // re-render stats screen labels in new language
  }

  // ============================================================
  // BOTTOM NAV: switch between List screen and Stats screen
  // ============================================================
  const navListBtn = document.getElementById('navListBtn');
  const navStatsBtn = document.getElementById('navStatsBtn');
  const listScreenEl = document.getElementById('listScreen');
  const statsScreenEl = document.getElementById('statsScreen');

  navListBtn.addEventListener('click', () => {
    navListBtn.classList.add('active');
    navStatsBtn.classList.remove('active');
    listScreenEl.classList.add('active');
    statsScreenEl.classList.remove('active');
  });

  navStatsBtn.addEventListener('click', () => {
    navStatsBtn.classList.add('active');
    navListBtn.classList.remove('active');
    statsScreenEl.classList.add('active');
    listScreenEl.classList.remove('active');
    renderStats();
  });

  // ============================================================
  // STATS SCREEN: weekly purchase patterns, computed locally from purchaseHistory
  // ============================================================
  const DAY_MS = 24 * 60 * 60 * 1000;

  function purchasesInRange(startMs, endMs) {
    return purchaseHistory.filter(p => p.timestamp >= startMs && p.timestamp < endMs);
  }

  function renderStats() {
    renderSuggestions();

    const now = Date.now();
    const thisWeekStart = now - 7 * DAY_MS;
    const lastWeekStart = now - 14 * DAY_MS;

    const thisWeek = purchasesInRange(thisWeekStart, now);
    const lastWeek = purchasesInRange(lastWeekStart, thisWeekStart);

    // Total items this week
    document.getElementById('statsWeekTotalValue').textContent = thisWeek.length;

    // Category breakdown this week
    const byCategory = {}; // catKey -> { count, color }
    thisWeek.forEach(p => {
      const key = p.catKey || 'other';
      if (!byCategory[key]) byCategory[key] = { count: 0, color: p.catColor || 'var(--purple)' };
      byCategory[key].count++;
    });
    const sortedCategories = Object.entries(byCategory).sort((a, b) => b[1].count - a[1].count);

    // Top category
    const topCategoryEl = document.getElementById('statsTopCategoryValue');
    if (sortedCategories.length > 0) {
      const [topKey] = sortedCategories[0];
      topCategoryEl.textContent = t().categories[topKey] || topKey;
    } else {
      topCategoryEl.textContent = '–';
    }

    // Week-over-week comparison
    const compareBox = document.getElementById('statsCompareBox');
    if (lastWeek.length === 0 && thisWeek.length === 0) {
      compareBox.innerHTML = `<span>📊</span><span>${t().statsNoDataYet}</span>`;
    } else if (lastWeek.length === 0) {
      compareBox.innerHTML = `<span>🆕</span><span>${t().statsFirstWeek}</span>`;
    } else {
      const diff = thisWeek.length - lastWeek.length;
      if (diff > 0) {
        compareBox.innerHTML = `<span>📈</span><span>${t().statsMoreThanLastWeek(diff)}</span>`;
      } else if (diff < 0) {
        compareBox.innerHTML = `<span>📉</span><span>${t().statsLessThanLastWeek(Math.abs(diff))}</span>`;
      } else {
        compareBox.innerHTML = `<span>➖</span><span>${t().statsSameAsLastWeek}</span>`;
      }
    }

    // Simple bar chart by category
    const chartEl = document.getElementById('statsChart');
    if (sortedCategories.length === 0) {
      chartEl.innerHTML = `<div class="stats-empty">${t().statsEmptyChart}</div>`;
      return;
    }
    const maxCount = sortedCategories[0][1].count;
    chartEl.innerHTML = sortedCategories.map(([key, data]) => {
      const label = t().categories[key] || key;
      const widthPct = Math.max(6, Math.round((data.count / maxCount) * 100));
      return `
        <div class="stats-bar-row">
          <span class="stats-bar-label">${escapeHtml(label)}</span>
          <div class="stats-bar-track">
            <div class="stats-bar-fill" style="width:${widthPct}%; background:${data.color}"></div>
          </div>
          <span class="stats-bar-count">${data.count}</span>
        </div>
      `;
    }).join('');
  }

  // ============================================================
  // SMART SUGGESTIONS: detect items bought on a consistent, repeating interval
  // ============================================================
  const MIN_PURCHASES_FOR_HABIT = 4; // need at least this many recorded purchases of an item
  const MAX_SUGGESTIONS = 6;

  // A habit is "consistent" if the gaps between purchases don't vary too wildly —
  // measured as the gaps' standard deviation relative to their average (coefficient
  // of variation). A lower ratio means a more regular rhythm.
  function detectHabits() {
    // Group purchase history by item name (case-insensitive, trimmed)
    const byName = new Map();
    purchaseHistory.forEach(p => {
      const key = p.name.trim().toLowerCase();
      if (!byName.has(key)) byName.set(key, []);
      byName.get(key).push(p);
    });

    const habits = [];
    byName.forEach((purchases, key) => {
      if (purchases.length < MIN_PURCHASES_FOR_HABIT) return;

      const sorted = [...purchases].sort((a, b) => a.timestamp - b.timestamp);
      const gaps = [];
      for (let i = 1; i < sorted.length; i++) {
        gaps.push((sorted[i].timestamp - sorted[i - 1].timestamp) / DAY_MS);
      }

      const avgGap = gaps.reduce((sum, g) => sum + g, 0) / gaps.length;
      if (avgGap <= 0) return;
      const variance = gaps.reduce((sum, g) => sum + (g - avgGap) ** 2, 0) / gaps.length;
      const stdDev = Math.sqrt(variance);
      const consistency = stdDev / avgGap; // lower = more consistent rhythm

      // Only treat it as a real habit if the rhythm is reasonably regular
      if (consistency > 0.6) return;

      const latest = sorted[sorted.length - 1];
      const daysSinceLast = (Date.now() - latest.timestamp) / DAY_MS;

      // Only suggest it if we're at or past the point where it'd usually be bought again
      if (daysSinceLast < avgGap * 0.7) return;

      habits.push({
        name: latest.name,
        catKey: latest.catKey,
        catColor: latest.catColor,
        avgGap,
      });
    });

    // Most "due" first (furthest past their expected interval)
    return habits.sort((a, b) => b.avgGap - a.avgGap).slice(0, MAX_SUGGESTIONS);
  }

  function renderSuggestions() {
    const card = document.getElementById('suggestionsCard');
    const listEl = document.getElementById('suggestionsList');
    const habits = detectHabits();

    if (habits.length === 0) {
      card.style.display = 'none';
      return;
    }

    card.style.display = 'block';
    listEl.innerHTML = habits.map(habit => {
      // Skip suggesting something already sitting in the active list, unbought
      const alreadyInList = items.some(i => !i.bought && i.name.trim().toLowerCase() === habit.name.trim().toLowerCase());
      return `
        <button class="suggestion-chip${alreadyInList ? ' added' : ''}" data-name="${escapeHtml(habit.name)}" data-cat-key="${habit.catKey || ''}" data-cat-color="${habit.catColor || ''}">
          <span class="plus">${alreadyInList ? '✓' : '+'}</span>${escapeHtml(habit.name)}
        </button>
      `;
    }).join('');
  }

  document.getElementById('suggestionsList').addEventListener('click', (e) => {
    const chip = e.target.closest('.suggestion-chip');
    if (!chip || chip.classList.contains('added')) return;
    addItem(chip.dataset.name);
    chip.classList.add('added');
    chip.querySelector('.plus').textContent = '✓';
  });

  // ============================================================
  // AUTH + SHARED LISTS
  // ============================================================
  const loginScreen = document.getElementById('loginScreen');
  const appRoot = document.getElementById('appRoot');
  const googleSignInBtn = document.getElementById('googleSignInBtn');
  const signOutBtn = document.getElementById('signOutBtn');
  const signedInEmail = document.getElementById('signedInEmail');
  const listPickerBtn = document.getElementById('listPickerBtn');
  const listPickerOverlay = document.getElementById('listPickerOverlay');
  const closeListPickerBtn = document.getElementById('closeListPickerBtn');
  const listPickerItemsEl = document.getElementById('listPickerItems');
  const newListNameInput = document.getElementById('newListNameInput');
  const createListBtn = document.getElementById('createListBtn');
  const joinCodeInput = document.getElementById('joinCodeInput');
  const joinListBtn = document.getElementById('joinListBtn');
  const joinListError = document.getElementById('joinListError');

  googleSignInBtn.addEventListener('click', () => {
    // TEMP DEBUG: prove the click handler is even firing on this device
    showLoginError({ message: 'DEBUG: הכפתור נלחץ, בודק חיבור ל-Firebase...' });
    try {
      if (!window.FB || !window.FB.signInWithGoogle) {
        showLoginError({ message: 'DEBUG: Firebase עדיין לא נטען (window.FB חסר) - זו הבעיה' });
        return;
      }
      window.FB.signInWithGoogle().catch(err => showLoginError(err));
    } catch (err) {
      showLoginError(err);
    }
  });

  function showLoginError(err) {
    console.error('Sign-in failed:', err);
    let existingMsg = document.getElementById('loginErrorMsg');
    if (!existingMsg) {
      existingMsg = document.createElement('p');
      existingMsg.id = 'loginErrorMsg';
      existingMsg.style.cssText = 'color:#ff6b6b;font-size:12px;margin-top:14px;word-break:break-word;';
      document.querySelector('.login-box').appendChild(existingMsg);
    }
    existingMsg.textContent = `שגיאת התחברות: ${err.code || err.message || err}`;
  }

  window.addEventListener('firebase-auth-error', (e) => showLoginError(e.detail));

  signOutBtn.addEventListener('click', () => {
    window.FB.signOutUser();
  });

  listPickerBtn.addEventListener('click', () => {
    listPickerOverlay.classList.add('show');
    renderListPicker();
  });
  closeListPickerBtn.addEventListener('click', () => listPickerOverlay.classList.remove('show'));
  listPickerOverlay.addEventListener('click', (e) => {
    if (e.target === listPickerOverlay) listPickerOverlay.classList.remove('show');
  });

  function generateJoinCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no ambiguous 0/O/1/I
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  createListBtn.addEventListener('click', async () => {
    const name = newListNameInput.value.trim();
    if (!name || !currentUser) return;
    const code = generateJoinCode();
    const newDoc = window.FB.doc(window.FB.collection(window.FB.db, 'lists'));
    await window.FB.setDoc(newDoc, {
      name,
      code,
      ownerUid: currentUser.uid,
      members: [currentUser.uid],
      items: [],
      purchaseHistory: [],
      createdAt: window.FB.serverTimestamp(),
    });
    newListNameInput.value = '';
    await loadMyLists();
    switchToList(newDoc.id);
    renderListPicker();
  });

  joinListBtn.addEventListener('click', async () => {
    const code = joinCodeInput.value.trim().toUpperCase();
    joinListError.textContent = '';
    if (!code || !currentUser) return;
    try {
      const q = window.FB.query(window.FB.collection(window.FB.db, 'lists'), window.FB.where('code', '==', code));
      const snap = await getDocsCompat(q);
      if (snap.empty) {
        joinListError.textContent = t().joinCodeNotFound;
        return;
      }
      const listDoc = snap.docs[0];
      await window.FB.updateDoc(window.FB.doc(window.FB.db, 'lists', listDoc.id), {
        members: window.FB.arrayUnion(currentUser.uid),
      });
      joinCodeInput.value = '';
      await loadMyLists();
      switchToList(listDoc.id);
      renderListPicker();
    } catch (err) {
      console.error('Join failed:', err);
      joinListError.textContent = t().joinCodeNotFound;
    }
  });

  // getDocs isn't imported by name above (kept the import list minimal) — small helper
  // that fetches a query's results once, used only for the join-by-code lookup.
  async function getDocsCompat(q) {
    const { getDocs } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
    return getDocs(q);
  }

  async function loadMyLists() {
    if (!currentUser) { myLists = []; return; }
    const q = window.FB.query(window.FB.collection(window.FB.db, 'lists'), window.FB.where('members', 'array-contains', currentUser.uid));
    const snap = await getDocsCompat(q);
    myLists = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  function renderListPicker() {
    if (myLists.length === 0) {
      listPickerItemsEl.innerHTML = `<p class="stats-empty">${t().noListsYet}</p>`;
    } else {
      listPickerItemsEl.innerHTML = myLists.map(list => `
        <div class="list-picker-item${list.id === activeListId ? ' active' : ''}" data-id="${list.id}">
          <div>
            <div class="list-name">${escapeHtml(list.name)}</div>
            <div class="list-code">${t().joinCodeLabel}: ${list.code}</div>
          </div>
          ${list.id === activeListId ? '✓' : ''}
        </div>
      `).join('');
    }
    signedInEmail.textContent = currentUser ? currentUser.email : '';
  }

  listPickerItemsEl.addEventListener('click', (e) => {
    const item = e.target.closest('.list-picker-item');
    if (item) {
      switchToList(item.dataset.id);
      listPickerOverlay.classList.remove('show');
    }
  });

  function switchToList(listId) {
    activeListId = listId;
    localStorage.setItem('activeListId', listId);
    subscribeToActiveList();
  }

  function subscribeToActiveList() {
    if (unsubscribeActiveList) { unsubscribeActiveList(); unsubscribeActiveList = null; }
    if (!activeListId) {
      items = [];
      purchaseHistory = [];
      render();
      renderStats();
      updateHeaderForList();
      return;
    }
    unsubscribeActiveList = window.FB.onSnapshot(
      window.FB.doc(window.FB.db, 'lists', activeListId),
      (docSnap) => {
        if (suppressNextSnapshot) { suppressNextSnapshot = false; return; }
        if (!docSnap.exists()) return;
        const data = docSnap.data();
        items = data.items || [];
        purchaseHistory = data.purchaseHistory || [];
        const removedStaleItems = cleanupStaleBoughtItems();
        render();
        renderStats();
        updateHeaderForList(data.name);
        // If cleanup actually removed something, push that change back to Firestore
        // so every member's list stays clean, not just this device's local view.
        if (removedStaleItems) save();
      },
      (err) => console.error('List subscription error:', err)
    );
  }

  // Removes items that were marked "bought" before today's midnight — a bought item
  // sticks around for the rest of the day it was checked off (so you can still see
  // your progress mid-shop), then quietly clears itself the next day.
  // Returns true if anything was actually removed.
  function cleanupStaleBoughtItems() {
    const todayMidnight = new Date();
    todayMidnight.setHours(0, 0, 0, 0);
    const cutoff = todayMidnight.getTime();

    const before = items.length;
    items = items.filter(item => !(item.bought && item.boughtAt && item.boughtAt < cutoff));
    return items.length !== before;
  }

  function updateHeaderForList(name) {
    const list = myLists.find(l => l.id === activeListId);
    const displayName = name || (list && list.name);
    document.getElementById('headerTitle').textContent = displayName
      ? `${displayName} 🛒`
      : t().headerTitle;
  }

  function startAuthListener() {
    window.FB.onAuthChange(async (user) => {
      currentUser = user;
      if (user) {
        loginScreen.style.display = 'none';
        appRoot.style.display = 'block';
        await loadMyLists();
        // If no active list, or the saved one isn't among ours anymore, fall back to the first available
        if (!activeListId || !myLists.some(l => l.id === activeListId)) {
          activeListId = myLists.length > 0 ? myLists[0].id : null;
          if (activeListId) localStorage.setItem('activeListId', activeListId);
        }
        subscribeToActiveList();
      } else {
        loginScreen.style.display = 'flex';
        appRoot.style.display = 'none';
        if (unsubscribeActiveList) { unsubscribeActiveList(); unsubscribeActiveList = null; }
      }
    });
  }

  // The Firebase module script (type="module") runs asynchronously and may not have
  // finished by the time this classic script executes, so wait for its ready signal —
  // unless it already fired before we got here (module scripts can sometimes beat a
  // classic script that comes after them, depending on load timing).
  if (window.FB) {
    startAuthListener();
  } else {
    window.addEventListener('firebase-ready', startAuthListener, { once: true });
  }

  // ============================================================
  // INIT
  // ============================================================
  applyTheme();
  applyLanguage();

  // In case the app is left open across midnight with no other activity to trigger
  // a fresh snapshot, periodically re-check for stale bought items on our own.
  setInterval(() => {
    if (!activeListId) return;
    const removed = cleanupStaleBoughtItems();
    if (removed) { render(); renderStats(); save(); }
  }, 5 * 60 * 1000); // every 5 minutes

  // Register the service worker so the app can be installed to the home
  // screen and load reliably even on a flaky connection.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('Service worker registration failed:', err));
    });
  }
</script>

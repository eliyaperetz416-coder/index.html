<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120e2b">
<meta name="description" content="מטבעות כיתה – מערכת תגמול התנהגות למורים מחליפים">
<title>מטבעות כיתה</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%23c27a00'/%3E%3Ccircle cx='24' cy='22.5' r='21' fill='%23ffc83d'/%3E%3Cpath d='M24 12L26.7 19.28L34.46 19.6L28.37 24.42L30.47 31.9L24 27.6L17.53 31.9L19.63 24.42L13.54 19.6L21.3 19.28Z' fill='%23a55f00'/%3E%3C/svg%3E">
<!-- Optional font: loaded without blocking rendering. Without internet the system font is used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // Request the font only when online, so an offline laptop shows no network errors.
  if (navigator.onLine !== false) {
    var fl = document.createElement('link');
    fl.rel = 'stylesheet'; fl.media = 'print';
    fl.href = 'https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap';
    fl.onload = function () { this.media = 'all'; };
    document.head.appendChild(fl);
  }
</script>
<style>
/* ==========================================================
   1. Tokens & base
   ========================================================== */
:root{
  --bg:#120e2b; --card:#211a4d; --card2:#2b2363; --line:#3d3480;
  --ink:#f4f1ff; --muted:#a9a1d9;
  --brand:#7c5cff; --brand2:#a78bff; --brandDeep:#4b32b8;
  --gold:#ffc83d; --gold2:#ff9f1c; --goldDeep:#b86f00; --goldInk:#3a2300;
  --good:#37e3a0; --goodTxt:#7ff0c4; --goodDeep:#14895c;
  --bad:#ff5d7a; --badTxt:#ff9aae; --badDeep:#a8233d;
  --radius:22px;
  --shadow:0 14px 34px rgba(5,2,20,.45);
  --font:'Rubik','Segoe UI','Arial Hebrew',Arial,system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; font-family:var(--font); color:var(--ink); line-height:1.45;
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 620px at 100% 0%, rgba(124,92,255,.38), transparent 62%),
    radial-gradient(800px 560px at 0% 100%, rgba(255,200,61,.16), transparent 62%);
  background-attachment:fixed;
  overflow-x:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.coin-ic{width:1.2em;height:1.2em;flex:none;vertical-align:-.25em}
#app{position:relative;z-index:1}

/* Letter avatar: first letter in a colored circle (hue from the student id) */
.av{
  --h:260; --sz:44px;
  width:var(--sz);height:var(--sz);flex:none;border-radius:50%;display:inline-grid;place-items:center;
  font-weight:800;font-size:calc(var(--sz) * .46);color:#fff;line-height:1;
  background:linear-gradient(135deg,hsl(var(--h) 85% 64%),hsl(calc(var(--h) + 40) 72% 44%));
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.av.sm{--sz:32px}
.av.md{--sz:40px}
.av.lg{--sz:62px;border-radius:50%}
.av.xl{--sz:72px}

/* Hexagon level badge */
.hexb{position:relative;display:inline-grid;place-items:center;width:var(--s,54px);height:calc(var(--s,54px) * 1.083);flex:none}
.hexb svg{position:absolute;inset:0;width:100%;height:100%}
.hexb b{position:relative;font-weight:800;color:#5a3300;font-size:calc(var(--s,54px) * .4);margin-top:calc(var(--s,54px) * -.04)}

/* ==========================================================
   2. Buttons, cards, inputs
   ========================================================== */
.btn{
  --b-bg:linear-gradient(180deg,var(--brand2),var(--brand)); --b-sh:var(--brandDeep); --b-tx:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:14px;padding:11px 18px;font-weight:700;font-size:15px;
  background:var(--b-bg);color:var(--b-tx);
  box-shadow:0 4px 0 var(--b-sh);
  transition:transform .12s ease,box-shadow .12s ease,filter .15s ease;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--b-sh)}
.btn:disabled{cursor:not-allowed;filter:saturate(.3);opacity:.7}
.btn-gold{--b-bg:linear-gradient(180deg,#ffe07a,var(--gold) 45%,var(--gold2));--b-sh:var(--goldDeep);--b-tx:var(--goldInk)}
.btn-good{--b-bg:linear-gradient(180deg,#7ff0c4,var(--good));--b-sh:var(--goodDeep);--b-tx:#03281a}
.btn-bad{--b-bg:linear-gradient(180deg,#ff8ea3,var(--bad));--b-sh:var(--badDeep);--b-tx:#2b0410}
.btn-ghost{--b-bg:rgba(255,255,255,.06);--b-sh:#0b0820;--b-tx:var(--ink);border:1px solid var(--line)}
.btn-small{padding:7px 12px;font-size:13px;border-radius:11px}
.icon-btn{
  width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);
  font-size:20px;display:inline-grid;place-items:center;color:var(--ink);box-shadow:0 4px 0 #0b0820;transition:transform .12s,box-shadow .12s,background .15s;
}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn:active{transform:translateY(4px);box-shadow:0 0 0 #0b0820}
.icon-btn[aria-pressed="true"]{color:var(--gold);border-color:rgba(255,200,61,.5)}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:4px;padding:8px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.link-btn:hover{color:var(--gold)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-title h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-title h2 .ic{color:var(--brand2)}
.card-title .sub{font-size:13px;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.note-field input{
  width:100%;background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:12px;padding:10px 12px;
  color:var(--ink);font-size:16px;transition:border-color .15s,background .15s;
}
.field input:focus,.field select:focus,.note-field input:focus{outline:none;border-color:var(--gold);background:rgba(0,0,0,.35)}
.field input::placeholder,.note-field input::placeholder{color:#7d74b3}
.field select option{background:var(--card)}

/* ==========================================================
   3. Shared layout: screens & top bar
   ========================================================== */
.screen{max-width:1320px;margin:0 auto;padding:18px clamp(16px,3vw,34px) 56px;animation:screenIn .25s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.hello{display:flex;align-items:center;gap:14px;min-width:0}
.hello h1{font-size:clamp(22px,4vw,30px);font-weight:800}
.hello p{margin:2px 0 0;color:var(--muted);font-size:14px}
.hello p b,.cl-name{color:var(--gold)}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ==========================================================
   4. Login
   ========================================================== */
.login{max-width:980px;text-align:center;padding-top:clamp(18px,6vh,64px)}
.login-top{display:flex;justify-content:flex-end;margin-bottom:6px}
.logo-coin{width:118px;height:118px;margin:0 auto 18px;border-radius:50%;position:relative;animation:bob 3.2s ease-in-out infinite;overflow:hidden;filter:drop-shadow(0 16px 30px rgba(255,190,40,.3))}
.logo-coin svg{width:100%;height:100%;display:block}
.logo-coin::after{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:rotate(20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes shine{0%,55%{left:-60%}85%,100%{left:130%}}
.login h1{
  font-size:clamp(38px,8vw,64px);font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(180deg,#fff6cf,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(120,60,0,.5));
}
.login .lead{font-size:clamp(17px,3vw,21px);color:var(--muted);margin:8px 0 28px}
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;margin:0 auto;max-width:860px}
.stu-btn{
  border:1px solid var(--line);border-radius:22px;padding:20px 10px 16px;background:var(--card2);
  box-shadow:0 5px 0 #0b0820;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .2s cubic-bezier(.3,1.6,.6,1),border-color .2s;
  animation:popIn .5s cubic-bezier(.3,1.5,.6,1) both;animation-delay:calc(var(--i,0) * 45ms);
}
.stu-btn .av{--sz:58px;transition:transform .3s}
.stu-btn .nm{font-size:19px;font-weight:800}
.stu-btn .hint{font-size:12px;color:var(--gold);font-weight:500;min-height:1.2em}
.stu-btn:hover{transform:translateY(-6px);border-color:var(--gold)}
.stu-btn:hover .av{transform:scale(1.1) rotate(-6deg)}
.stu-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0820}
@keyframes popIn{from{opacity:0;transform:scale(.7) translateY(16px)}to{opacity:1;transform:none}}
.login-foot{margin-top:30px}
.empty-note{padding:26px;border:2px dashed var(--line);border-radius:20px;color:var(--muted);max-width:520px;margin:0 auto}

/* Class picker */
.class-page{max-width:980px;margin:0 auto}
.class-head{text-align:center;margin:clamp(4px,3vh,26px) 0 20px}
.class-head h2{font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.2}
.search{position:relative;max-width:560px;margin:0 auto 18px}
.search .ic{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--brand2);pointer-events:none}
.search input{width:100%;background:rgba(0,0,0,.28);border:2px solid var(--line);border-radius:18px;padding:15px 18px;padding-inline-start:50px;font-size:18px;color:var(--ink);transition:border-color .15s,background .15s,box-shadow .15s}
.search input::placeholder{color:#8a81c4}
.search input:focus{outline:none;border-color:var(--gold);background:rgba(0,0,0,.4);box-shadow:0 0 0 4px rgba(255,200,61,.16)}
.class-actions{display:flex;justify-content:center;margin:0 0 22px}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;text-align:start}
.class-card{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:start;padding:20px 18px 18px;border-radius:22px;
  border:1px solid var(--line);background:var(--card2);box-shadow:0 5px 0 #0b0820;
  transition:transform .2s cubic-bezier(.3,1.6,.6,1),border-color .2s,box-shadow .12s;
}
.class-card:hover{transform:translateY(-5px);border-color:var(--gold)}
.class-card:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0820}
.class-card .cname{font-size:30px;font-weight:800;line-height:1.1}
.class-card .meta{display:flex;gap:8px;flex-wrap:wrap}
.class-card .pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--muted)}
.class-card .pill b{color:var(--ink);font-weight:700}
.class-card .pill.gold b{color:var(--gold)}
.class-card .last{position:absolute;top:14px;inset-inline-end:14px;font-size:12px;font-weight:700;color:var(--goldInk);background:linear-gradient(180deg,#ffe07a,var(--gold2));padding:3px 10px;border-radius:999px}
.class-grid.enter .class-card{animation:popIn .4s cubic-bezier(.3,1.5,.6,1) both;animation-delay:calc(var(--i,0) * 50ms)}
.cls-input{direction:rtl;letter-spacing:0;font-size:20px}

/* ==========================================================
   5. Student dashboard
   ========================================================== */
.dash{display:flex;flex-direction:column;gap:20px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.hud{
  position:relative;overflow:hidden;padding:24px 26px;
  background:linear-gradient(135deg,#3b2a99,#6b4cff 60%,#8a6cff);border-color:rgba(255,255,255,.2);
}
.hud-bgcoin{position:absolute;width:260px;height:260px;inset-inline-end:-60px;top:-70px;opacity:.13;transform:rotate(-16deg);pointer-events:none}
.hud-inner{position:relative;max-width:640px}
.balance-label{font-size:15px;color:#e4dcff;font-weight:500}
.balance{display:flex;align-items:center;gap:14px;margin-top:2px}
.balance .coin-big{width:64px;height:64px;flex:none;animation:spinY 4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(60,20,120,.45))}
@keyframes spinY{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(180deg)}}
.balance-num{font-size:clamp(58px,9vw,86px);font-weight:800;color:var(--gold);line-height:1;text-shadow:0 5px 0 rgba(90,40,0,.45),0 0 30px rgba(255,200,61,.35);font-variant-numeric:tabular-nums}
.balance-num.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.level-row{display:flex;align-items:center;gap:14px;margin-top:18px}
.level-info{flex:1;min-width:0}
.level-name{font-weight:800;font-size:17px}
.xp{margin-top:8px;height:16px;border-radius:999px;background:rgba(10,5,40,.4);border:1px solid rgba(255,255,255,.18);overflow:hidden;position:relative}
.xp i{
  position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--gold2),var(--gold),#fff1a8);
  box-shadow:0 0 16px rgba(255,200,61,.6);transition:width 1s cubic-bezier(.2,.8,.2,1);
}
.xp i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.25) 0 8px,transparent 8px 16px);animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:32px 0}}
.xp-text{font-size:14px;color:#e4dcff;margin-top:6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:rgba(10,5,40,.3);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:7px 12px;font-size:13px;color:#e4dcff}
.stat b{color:#fff;font-size:16px}

/* Charts row */
.charts-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.chart{position:relative;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;direction:ltr;touch-action:pan-y;border-radius:12px}
.chart svg:focus{outline:none}
.chart svg:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.ax text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.ax .cap{fill:var(--brand2);font-weight:700}
.gridl{stroke:rgba(169,161,217,.14);stroke-width:1}
.axis-base{stroke:rgba(169,161,217,.4);stroke-width:1}
.bal-line{fill:none;stroke:var(--gold);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.bal-dot{fill:var(--card);stroke:var(--gold);stroke-width:2}
.last-ring{fill:rgba(255,200,61,.22);stroke:none}
.last-dot{fill:var(--gold);stroke:#fff;stroke-width:2.5}
.last-val{fill:var(--gold);font-weight:800;font-size:13px;font-family:var(--font)}
.cross{stroke:rgba(255,255,255,.45);stroke-dasharray:4 4}
.hl{fill:var(--gold);stroke:#fff;stroke-width:2}
.bar-pos{fill:var(--good)}
.bar-neg{fill:var(--bad)}
.bar-hover{fill:rgba(255,255,255,.07)}
/* enter animations (only on first draw after opening the dashboard) */
.chart svg.enter .bal-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out .1s forwards}
.chart svg.enter .bal-area,.chart svg.enter .bal-dot{animation:fadeIn .7s ease .5s both}
.chart svg.enter .last-g{animation:popDot .5s cubic-bezier(.3,1.8,.5,1) 1.05s both;transform-box:fill-box;transform-origin:center}
.chart svg.enter .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes popDot{from{transform:scale(0)}to{transform:scale(1)}}
.tt{
  position:absolute;top:0;left:0;pointer-events:none;z-index:3;min-width:150px;max-width:240px;
  background:rgba(14,10,40,.97);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:13px;
  box-shadow:0 10px 24px rgba(0,0,0,.45);opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity .12s;
}
.tt.show{opacity:1}
.tt strong{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:3px}
.tt .tp{color:var(--goodTxt);font-weight:700}
.tt .tn{color:var(--badTxt);font-weight:700}
.tt .tg{color:var(--gold);font-weight:700}
.chart-empty{display:grid;place-items:center;text-align:center;min-height:190px;border:2px dashed var(--line);border-radius:16px;color:var(--muted);padding:18px;background:rgba(0,0,0,.12)}
.chart-empty .ic{width:42px;height:42px;color:var(--brand2);margin-bottom:6px}
.chart-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}

/* Shop */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.reward{
  position:relative;border-radius:18px;padding:16px 12px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--card2);border:1px solid var(--line);
  transition:transform .2s cubic-bezier(.3,1.6,.6,1),border-color .2s,box-shadow .2s;
}
.reward:hover{transform:translateY(-5px);box-shadow:0 14px 26px rgba(0,0,0,.35)}
.reward.can{border-color:rgba(255,200,61,.6)}
.r-gift{width:50px;height:50px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
.reward.can .r-gift{animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
.r-name{font-weight:700;font-size:15px;min-height:2.4em;display:flex;align-items:center}
.r-cost{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--gold);font-size:17px}
.r-bar{width:100%;height:7px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;margin:2px 0 6px}
.r-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:9px;transition:width .8s ease}
.reward.can .r-bar i{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.reward .btn{width:100%}
.reward .btn:disabled{font-size:13px}

/* Feed */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.feed-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.18);
  border:1px solid var(--line);border-inline-start:5px solid var(--muted);
}
.feed-item.pos{border-inline-start-color:var(--good)}
.feed-item.neg{border-inline-start-color:var(--bad)}
.feed-item.buy{border-inline-start-color:var(--gold)}
.feed-item.anim{animation:feedIn .45s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes feedIn{from{opacity:0;transform:translateX(-24px) scale(.97)}to{opacity:1;transform:none}}
.f-main{flex:1;min-width:0}
.f-text{font-weight:700;font-size:15px}
.f-note{margin-top:5px;font-size:14px;color:#ece7ff;background:rgba(124,92,255,.2);border-radius:10px;padding:5px 9px;display:inline-flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.f-note .ic{color:var(--brand2);margin-top:2px}
.f-time{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.f-amt{font-weight:800;font-size:17px;padding:4px 10px;border-radius:999px;flex:none;min-width:54px;text-align:center}
.pos .f-amt{color:var(--goodTxt);background:rgba(55,227,160,.14)}
.neg .f-amt,.buy .f-amt{color:var(--badTxt);background:rgba(255,93,122,.14)}
.zero .f-amt{color:var(--muted);background:rgba(255,255,255,.08)}
.more-btn{margin-top:14px;width:100%}
.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
.empty .ic{width:36px;height:36px;color:var(--brand2);display:block;margin:0 auto 6px}

/* Full activity view */
.act-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--brand2),var(--brand));color:#fff;border-color:transparent;box-shadow:0 3px 0 var(--brandDeep)}
.chip .n{opacity:.8;font-weight:500;margin-inline-start:4px}
.day-group+.day-group{margin-top:20px}
.day-h{font-size:15px;font-weight:800;color:var(--brand2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.day-h::after{content:"";flex:1;height:1px;background:var(--line)}
.day-h .cnt{font-weight:500;color:var(--muted);font-size:13px}

/* Leaderboard */
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.board li.me{border-color:var(--gold);background:rgba(255,200,61,.12)}
.board .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:rgba(255,255,255,.08);flex:none}
.board .r1{background:linear-gradient(180deg,#ffe07a,var(--gold2));color:var(--goldInk)}
.board .r2{background:linear-gradient(180deg,#eef0ff,#a9b0d6);color:#22264a}
.board .r3{background:linear-gradient(180deg,#ffc79a,#c9763a);color:#3a1a00}
.board .bn{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .bv{font-weight:800;color:var(--gold);display:inline-flex;align-items:center;gap:5px}

/* ==========================================================
   6. Teacher panel
   ========================================================== */
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;background:rgba(0,0,0,.22);padding:6px;border-radius:18px;border:1px solid var(--line);width:fit-content;max-width:100%}
.tab{border:0;background:transparent;padding:10px 16px;border-radius:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.tab[aria-selected="true"]{background:linear-gradient(180deg,#ffe07a,var(--gold) 45%,var(--gold2));color:var(--goldInk);box-shadow:0 3px 0 var(--goldDeep)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;display:inline-grid;place-items:center}
.tab[aria-selected="true"] .badge{background:#7a2a00}

.t-actions{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr);gap:20px;align-items:start}
.roster{position:sticky;top:14px}
.roster-list{list-style:none;margin:0;padding:2px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 230px);overflow-y:auto;scrollbar-width:thin}
.stu-row{
  width:100%;position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:15px;border:2px solid var(--line);
  background:rgba(0,0,0,.18);text-align:start;transition:border-color .15s,background .15s,transform .15s;
}
.stu-row:hover{border-color:var(--brand2);transform:translateX(-3px)}
.stu-row .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.stu-row .ck .ic{width:16px;height:16px;stroke-width:3}
.stu-row .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu-row .cn{font-weight:800;color:var(--gold);display:flex;align-items:center;gap:5px;flex:none}
.stu-row[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,200,61,.12)}
.stu-row[aria-pressed="true"] .ck{background:var(--gold);border-color:var(--gold);color:var(--goldInk)}
.stu-row.pulse{animation:rowPulse .7s ease}
@keyframes rowPulse{0%{box-shadow:0 0 0 0 rgba(255,200,61,.7)}100%{box-shadow:0 0 0 14px rgba(255,200,61,0)}}
.float-delta{position:absolute;inset-inline-end:64px;top:4px;font-weight:800;font-size:20px;pointer-events:none;animation:floatUp 1.2s ease-out forwards;direction:ltr}
.float-delta.p{color:var(--goodTxt)} .float-delta.n{color:var(--badTxt)}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.7)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-34px) scale(1)}}
.sel-info{font-size:13px;color:var(--muted);margin:-6px 0 10px}

.note-field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);margin-bottom:18px}
.note-field>span{display:flex;align-items:center;gap:6px}
.note-field input.has{border-color:var(--brand)}
.grp{font-size:17px;font-weight:800;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.grp.pos{color:var(--goodTxt)} .grp.neg{color:var(--badTxt)}
.beh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.beh{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 10px 14px;border-radius:17px;border:2px solid;text-align:center;
  transition:transform .12s ease,filter .15s,box-shadow .12s;font-weight:700;font-size:15px;min-height:92px;
}
.beh .bc{font-weight:800;font-size:30px;line-height:1.1}
.beh .bl{min-width:0}
.beh.p{background:linear-gradient(180deg,rgba(55,227,160,.24),rgba(55,227,160,.08));border-color:rgba(55,227,160,.6);box-shadow:0 4px 0 #0d5e40}
.beh.p .bc{color:var(--goodTxt)}
.beh.n{background:linear-gradient(180deg,rgba(255,93,122,.24),rgba(255,93,122,.08));border-color:rgba(255,93,122,.6);box-shadow:0 4px 0 #6d1428}
.beh.n .bc{color:var(--badTxt)}
.beh:hover{filter:brightness(1.15)}
.beh:active{transform:translateY(4px);box-shadow:0 0 0 transparent}

.recent-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.recent-list li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:13px;background:rgba(0,0,0,.18);border:1px solid var(--line);flex-wrap:wrap}
.recent-list li:first-child{border-color:rgba(167,139,255,.6)}
.recent-list .ra{font-weight:800;min-width:44px;text-align:center}
.recent-list .ra.p{color:var(--goodTxt)} .recent-list .ra.n{color:var(--badTxt)}
.recent-list .rl{font-weight:700}
.recent-list .rw{color:var(--muted);font-size:13px;flex:1;min-width:120px}
.recent-list time{color:var(--muted);font-size:12px}

.orders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.order{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid var(--line);flex-wrap:wrap}
.order.pending{border-color:rgba(255,200,61,.5)}
.order.done{opacity:.68}
.order .og{width:38px;height:38px;flex:none}
.order .om{flex:1;min-width:160px}
.order .ot{font-weight:800}
.order .os{font-size:13px;color:var(--muted)}
.done-tag{color:var(--goodTxt);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}

.edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start}
.add-form{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--line);margin-bottom:14px}
.field-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px}
.field-row.r3{grid-template-columns:minmax(0,1fr) 110px 90px}
.ed-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;scrollbar-width:thin}
.ed-list li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;background:rgba(0,0,0,.18);border:1px solid var(--line);flex-wrap:wrap}
.ed-list .en{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-list .ev{font-weight:800;flex:none;display:inline-flex;align-items:center;gap:4px}
.ed-list .ev.p{color:var(--goodTxt)} .ed-list .ev.n{color:var(--badTxt)} .ed-list .ev.g{color:var(--gold)}
.ed-sub{flex-basis:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-inline-start:42px}
.pw-tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.pw-tag.set{color:var(--goodTxt);background:rgba(55,227,160,.12)}
.pw-tag.unset{color:var(--muted);background:rgba(255,255,255,.06)}
.edit-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);display:grid;place-items:center;flex:none;transition:background .15s,transform .15s}
.edit-btn:hover{background:rgba(255,255,255,.14);transform:scale(1.06)}
.move{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.mini-select{background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:10px;padding:5px 8px;color:var(--ink);font-size:14px}
.mini-select option{background:var(--card)}
.del{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,93,122,.4);background:rgba(255,93,122,.12);color:var(--badTxt);display:grid;place-items:center;flex:none;transition:background .15s,transform .15s}
.del:hover{background:rgba(255,93,122,.3);transform:scale(1.06)}
.switch-row{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid var(--line);font-weight:700}
.switch-row input{position:absolute;opacity:0;width:1px;height:1px}
.switch{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.6,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.switch-row input:checked+.switch{background:var(--good)}
.switch-row input:checked+.switch::after{transform:translateX(-22px)}
.switch-row input:focus-visible+.switch{outline:3px solid var(--gold);outline-offset:3px}
.tool-box{margin-top:16px;padding:14px;border-radius:16px;border:1px solid rgba(167,139,255,.5);background:rgba(124,92,255,.1)}
.tool-box h3,.danger h3{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.tool-box h3{color:var(--brand2)}
.tool-box p,.danger p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.danger{margin-top:16px;padding:14px;border-radius:16px;border:1px dashed rgba(255,93,122,.55);background:rgba(255,93,122,.07)}
.danger h3{color:var(--badTxt)}

/* ==========================================================
   7. Overlays: toasts, modal, level-up, confetti
   ========================================================== */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,460px);pointer-events:none}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;font-weight:700;font-size:15px;
  background:rgba(22,16,60,.97);border:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.45);
  opacity:0;transform:translateY(-16px) scale(.95);transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.6,1);max-width:100%;
}
.toast.show{opacity:1;transform:none}
.toast .t-ico{width:22px;height:22px}
.toast.success{border-color:rgba(55,227,160,.7)} .toast.success .t-ico{color:var(--good)}
.toast.error{border-color:rgba(255,93,122,.8)} .toast.error .t-ico{color:var(--bad)}
.toast.warn{border-color:rgba(255,93,122,.55)} .toast.warn .t-ico{color:var(--bad)}
.toast.info .t-ico{color:var(--brand2)}

.modal-back{position:fixed;inset:0;z-index:50;background:rgba(8,5,26,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .2s}
.modal-back.open{opacity:1}
.modal{
  width:min(100%,420px);background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:24px;
  box-shadow:0 30px 60px rgba(0,0,0,.5);transform:scale(.88) translateY(20px);transition:transform .3s cubic-bezier(.3,1.5,.6,1);text-align:center;
}
.modal-back.open .modal{transform:none}
.m-icon{display:grid;place-items:center;margin:0 auto 10px}
.m-icon .ic{width:52px;height:52px;padding:12px;border-radius:50%;background:rgba(124,92,255,.2);color:var(--brand2);box-sizing:content-box}
.m-icon.danger .ic{background:rgba(255,93,122,.16);color:var(--bad)}
.m-icon .r-gift{width:60px;height:60px}
.modal h2{font-size:22px;font-weight:800;margin-bottom:8px}
.modal .m-body{color:var(--muted);font-size:15px;margin-bottom:18px}
.modal .m-body b{color:var(--ink)}
.modal .m-body p{margin:0 0 10px}
.modal .m-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.modal .m-actions .btn{min-width:120px}
.m-field{display:block;text-align:start;margin-top:10px;font-size:13px;color:var(--muted)}
.pin-input{width:100%;text-align:center;font-size:22px;letter-spacing:4px;font-weight:700;background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);direction:ltr;margin-top:6px}
.pin-input:focus{outline:none;border-color:var(--gold)}
.m-hint{font-size:13px;color:var(--muted);margin-top:12px}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.levelup{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(8,5,26,.72);animation:fadeIn .25s ease both;cursor:pointer;padding:16px}
.levelup.out{animation:fadeOut .35s ease both}
.lu-card{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;max-width:92vw}
.lu-burst{position:absolute;left:50%;top:70px;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:repeating-conic-gradient(rgba(255,200,61,.3) 0 10deg,transparent 10deg 20deg);animation:spin 9s linear infinite;pointer-events:none;mask-image:radial-gradient(circle,#000 25%,transparent 68%);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%)}
.lu-card .hexb{--s:140px;animation:luPop .8s cubic-bezier(.3,1.7,.5,1) both;filter:drop-shadow(0 12px 30px rgba(255,190,40,.5))}
.lu-title{position:relative;font-size:clamp(26px,6vw,38px);font-weight:800;margin-top:22px;color:#fff;text-shadow:0 4px 0 rgba(60,20,120,.6);animation:fadeUp .5s ease .35s both}
.lu-hint{position:relative;font-size:13px;margin-top:10px;color:var(--muted);animation:fadeUp .5s ease .6s both}
@keyframes luPop{from{transform:scale(.1) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ==========================================================
   8. Responsive
   ========================================================== */
@media (max-width:920px){
  .cols,.charts-row{grid-template-columns:1fr}
  .t-actions{grid-template-columns:1fr}
  .roster{position:static}
  .roster-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-height:none}
}
@media (max-width:560px){
  .card{padding:16px;border-radius:18px}
  .hud{padding:20px 18px}
  .hud-bgcoin{width:180px;height:180px;inset-inline-end:-50px;top:-50px}
  .balance .coin-big{width:52px;height:52px}
  .student-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .stu-btn{padding:16px 8px 12px}
  .stu-btn .av{--sz:50px}
  .shop-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .reward{padding:12px 10px}
  .r-name{font-size:14px}
  .beh-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .beh{min-height:84px}
  .beh .bc{font-size:26px}
  .roster-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stu-row{padding:7px 8px;gap:6px}
  .stu-row .ck{display:none}
  .stu-row .av{--sz:28px}
  .stu-row .cn .coin-ic{display:none}
  .field-row,.field-row.r3{grid-template-columns:1fr 1fr}
  .field-row .field:first-child{grid-column:1/-1}
  .ed-sub{padding-inline-start:0}
  .tabs{width:100%}
  .tab{flex:1;justify-content:center;padding:10px 6px;font-size:14px}
  .tab .ic{display:none}
  .av.lg{--sz:52px}
  .topbar .btn{padding:9px 12px;font-size:14px}
}

@media (max-width:599px){
  .class-grid{grid-template-columns:1fr}
  .class-card{padding:18px 16px 16px}
  .class-card .cname{font-size:26px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

const SEED_CLASSES = [
  { name: "ז'1", students: ['נועם', 'מיה', 'יובל', 'תמר', 'איתי', 'שירה', 'דור', 'ליה'] },
  { name: "ז'2", students: ['אורי', 'גל', 'רוני', 'ענבר', 'טל', 'אלון'] },
  { name: "ז'3", students: ['ניר', 'לינוי', 'אופיר', 'הילה', 'רועי', 'מאי'] }
];
const POS_NOTES = ['כל הכבוד, ככה ממשיכים!', 'עבודה מצוינת בקבוצה', 'עזרת לחבר בתרגיל בחשבון', 'שאלה מצוינת בשיעור מדעים', 'קריאה בקול רם ויפה מאוד', 'הובלת את הדיון על הסיפור', 'סידרת את הכיתה בלי שביקשו'];
const NEG_NOTES = ['בפעם הבאה נא להביא מחברת', 'נא לשמור על שקט בזמן ההסבר', 'מחר מתחילים מחדש', 'נא להגיע בזמן לשיעור'];

function createSeed() {
  const rnd = mulberry32(20261021);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const now = Date.now();
  const days = lastDays(BALANCE_DAYS);
  const posB = SEED_BEHAVIORS.filter(b => b.coins > 0), negB = SEED_BEHAVIORS.filter(b => b.coins < 0);
  let id = 1;
  const behaviors = SEED_BEHAVIORS.map(b => ({ id: id++, ...b }));
  const rewards = SEED_REWARDS.map(r => ({ id: id++, ...r }));
  const classes = SEED_CLASSES.map(c => ({ id: id++, name: c.name }));
  const students = [], log = [], orders = [], used = new Set();

  // One plausible 2-week history: behavior events at school hours, replayed in time order
  // with the 0-floor applied, plus occasional purchases between events.
  function simulate() {
    const bias = 0.64 + rnd() * 0.16;
    const raw = [];
    for (const ds of days) {
      const wd = new Date(ds).getDay();
      if (wd === 6) continue; // no school on Saturday
      const n = wd === 5 ? 1 : 1 + Math.floor(rnd() * 3);
      for (let k = 0; k < n; k++) {
        const t = ds + (8 * 60 + Math.floor(rnd() * 390)) * 60000 + Math.floor(rnd() * 60) * 1000;
        if (t > now - 3 * 60000) continue;
        const b = rnd() < bias ? pick(posB) : pick(negB);
        raw.push({ t, b, note: rnd() < 0.3 ? pick(b.coins > 0 ? POS_NOTES : NEG_NOTES) : '' });
      }
    }
    raw.sort((a, b) => a.t - b.t);
    let bal = 0, earned = 0;
    const events = [], buys = [];
    raw.forEach((ev, i) => {
      const after = Math.max(0, bal + ev.b.coins), applied = after - bal;
      bal = after; if (applied > 0) earned += applied;
      events.push({ t: ev.t, text: ev.b.label, note: ev.note, delta: applied });
      const affordable = SEED_REWARDS.filter(r => r.cost <= bal);
      if (affordable.length && bal >= 25 && rnd() < 0.38) {
        const next = raw[i + 1] ? raw[i + 1].t : now;
        const tb = ev.t + Math.min(30 * 60000, Math.floor((next - ev.t) / 2));
        if (tb > ev.t && tb < now - 60000) {
          const r = pick(affordable);
          bal -= r.cost;
          events.push({ t: tb, text: `קנייה: ${r.label}`, note: '', delta: -r.cost, kind: 'buy' });
          buys.push({ t: tb, reward: r.label });
        }
      }
    });
    return { coins: bal, earned, events, buys };
  }

  const roster = SEED_CLASSES.flatMap((cl, ci) => cl.students.map(name => ({ name, classId: classes[ci].id })));
  for (const { name, classId } of roster) {
    let best = null, bestScore = Infinity;
    for (let attempt = 0; attempt < 400; attempt++) {
      const sim = simulate();
      const score = (sim.coins < 10 ? 10 - sim.coins : sim.coins > 40 ? sim.coins - 40 : 0) + (used.has(sim.coins) ? 5 : 0) + (sim.events.length < 6 ? 5 : 0);
      if (score < bestScore) { best = sim; bestScore = score; }
      if (score === 0) break;
    }
    used.add(best.coins);
    const sid = id++;
    students.push({ id: sid, name, classId, pin: '', coins: best.coins, totalEarned: best.earned });
    best.events.forEach(e => log.push({ ...e, studentId: sid }));
    best.buys.forEach(b => orders.push({ id: id++, t: b.t, studentId: sid, reward: b.reward, done: now - b.t > DAY }));
  }
  log.sort((a, b) => a.t - b.t);
  orders.sort((a, b) => a.t - b.t);
  return { students, behaviors, rewards, classes, log, orders, actions: [], settings: { leaderboard: true }, nextId: id };
}

/* ==========================================================
   5. Mutations (every one persists, then re-renders)
   ========================================================== */
/** Apply a coin change with the 0-floor; logs the actually applied delta. */
function applyDelta(student, delta, text, note, kind, aid) {
  const before = student.coins;
  const after = Math.max(0, before + delta);
  const applied = after - before;
  student.coins = after;
  if (applied > 0) student.totalEarned += applied;
  const entry = { t: Date.now(), studentId: student.id, text, note: note || '', delta: applied };
  if (kind) entry.kind = kind;
  if (aid) entry.aid = aid;
  state.log.push(entry);
  return applied;
}

/** Apply a behavior to every selected student, as one undoable action. */
function applyBehavior(b, { useNote = true, random = false } = {}) {
  const targets = state.students.filter(s => ui.selected.has(s.id) && s.classId === ui.classId);
  if (!targets.length) {
    toast(random ? 'בחרו קודם תלמידים בלשונית פעולות' : 'בחרו קודם לפחות תלמיד אחד מהרשימה', 'error');
    play('error');
    shake($('.roster') || $('#demo-box'));
    return;
  }
  const note = useNote ? cleanText(ui.note, 120) : '';
  const aid = state.nextId++;
  const items = [], ups = [];
  for (const s of targets) {
    const lvBefore = levelIndex(s.totalEarned);
    items.push({ studentId: s.id, applied: applyDelta(s, b.coins, b.label, note, null, aid) });
    const lvAfter = levelIndex(s.totalEarned);
    if (lvAfter > lvBefore) ups.push([s, lvAfter]);
  }
  state.actions.push({ id: aid, t: Date.now(), label: b.label, coins: b.coins, note, random, items });
  if (state.actions.length > MAX_ACTIONS) state.actions.splice(0, state.actions.length - MAX_ACTIONS);
  if (useNote) {
    ui.note = '';
    const noteInput = $('#note');
    if (noteInput) { noteInput.value = ''; noteInput.classList.remove('has'); }
  }
  save();
  render();
  items.forEach(it => floatDelta(it.studentId, it.applied));
  const who = targets.length === 1 ? `ל${esc(targets[0].name)}` : `ל-${targets.length} תלמידים`;
  toast(`${random ? 'אירוע אקראי: ' : ''}${esc(b.label)} ${numSpan(b.coins)} ${who}${note ? ' · עם הערה' : ''}`, b.coins > 0 ? 'success' : 'warn');
  if (b.coins > 0) { confetti(targets.length > 3 ? 160 : 110); play('coin'); } else play('down');
  ups.forEach(([s, l], i) => setTimeout(() => { toast(`רמה חדשה ל${esc(s.name)}: רמה ${l + 1} · ${LEVELS[l]}`, 'success', 3800); play('level'); }, 500 + i * 300));
}
function awardBehavior(behaviorId) {
  const b = state.behaviors.find(x => x.id === behaviorId);
  if (b) applyBehavior(b);
}
function randomEvent() {
  const pos = state.behaviors.filter(b => b.coins > 0);
  if (!pos.length) { toast('אין התנהגויות חיוביות ברשימה', 'error'); return; }
  applyBehavior(pos[Math.floor(Math.random() * pos.length)], { useNote: false, random: true });
}

/** Reverse the latest behavior action of the current class: coins, totalEarned and its log entries. */
function undoLast() {
  const mine = classActions();
  const a = mine[mine.length - 1];
  if (!a) { toast('אין פעולה לביטול', 'info'); return; }
  for (const it of a.items) {
    const s = studentById(it.studentId);
    if (!s) continue;
    s.coins = Math.max(0, s.coins - it.applied);
    if (it.applied > 0) s.totalEarned = Math.max(0, s.totalEarned - it.applied);
  }
  state.log = state.log.filter(e => e.aid !== a.id);
  state.actions = state.actions.filter(x => x.id !== a.id);
  save(); render();
  toast(`בוטלה הפעולה: ${esc(a.label)} ${numSpan(a.coins)}`, 'info');
  play('down');
}

function buyReward(rewardId) {
  const s = studentById(ui.studentId), r = state.rewards.find(x => x.id === rewardId);
  if (!s || !r) return;
  if (s.coins < r.cost) { toast(`חסרים לך עוד ${r.cost - s.coins} מטבעות`, 'error'); play('error'); return; }
  openModal({
    iconHtml: giftIc(),
    title: 'לקנות את הפרס?',
    body: `<b>${esc(r.label)}</b> תמורת <b>${r.cost}</b> מטבעות.<br>אחרי הקנייה יישארו לך <b>${s.coins - r.cost}</b> מטבעות.`,
    okText: 'כן, לקנות!', okClass: 'btn-gold',
    onOk: () => {
      const cur = studentById(ui.studentId), rw = state.rewards.find(x => x.id === rewardId);
      if (!cur || !rw || cur.coins < rw.cost) { toast('אין מספיק מטבעות', 'error'); return; }
      applyDelta(cur, -rw.cost, `קנייה: ${rw.label}`, '', 'buy');
      state.orders.push({ id: state.nextId++, t: Date.now(), studentId: cur.id, reward: rw.label, done: false });
      save();
      render();
      confetti(170);
      play('buy');
      toast(`קנית ${esc(rw.label)}! ההזמנה נשלחה למורה`, 'success', 3400);
    }
  });
}

function markDelivered(orderId) {
  const o = state.orders.find(x => x.id === orderId);
  if (!o || o.done) return;
  o.done = true;
  save(); render();
  toast(`${esc(o.reward)} סומן כנמסר`, 'success');
  play('coin');
}

function addStudent(fd) {
  const name = cleanText(fd.get('name'), 20);
  if (!name) { toast('נא להזין שם', 'error'); return false; }
  const start = toInt(fd.get('coins'), 0, 999, 0);
  const s = { id: state.nextId++, name, pin: '', classId: ui.classId, coins: 0, totalEarned: 0 };
  state.students.push(s);
  if (start > 0) applyDelta(s, start, 'מטבעות פתיחה', '');
  save(); render();
  toast(`${esc(name)} נוסף/ה לכיתה`, 'success');
  return true;
}
function addBehavior(fd) {
  const label = cleanText(fd.get('label'), 30);
  if (!label) { toast('נא להזין שם להתנהגות', 'error'); return false; }
  const amount = toInt(fd.get('amount'), 1, 100, 0);
  if (!amount) { toast('נא להזין כמות מטבעות (1–100)', 'error'); return false; }
  const coins = fd.get('sign') === 'neg' ? -amount : amount;
  state.behaviors.push({ id: state.nextId++, label, coins });
  save(); render();
  toast(`ההתנהגות "${esc(label)}" נוספה`, 'success');
  return true;
}
function addReward(fd) {
  const label = cleanText(fd.get('label'), 30);
  if (!label) { toast('נא להזין שם לפרס', 'error'); return false; }
  const cost = toInt(fd.get('cost'), 1, 9999, 0);
  if (!cost) { toast('נא להזין מחיר (1–9999)', 'error'); return false; }
  state.rewards.push({ id: state.nextId++, label, cost });
  save(); render();
  toast(`הפרס "${esc(label)}" נוסף לחנות`, 'success');
  return true;
}
function deleteItem(kind, id) {
  // Resolve the list lazily: another tab may replace `state` while the confirm modal is open.
  const getList = () => kind === 'student' ? state.students : kind === 'behavior' ? state.behaviors : state.rewards;
  const item = getList().find(x => x.id === id);
  if (!item) return;
  const name = item.name || item.label;
  const extra = kind === 'student' ? '<br>גם ההיסטוריה וההזמנות של התלמיד/ה יימחקו.' : '';
  openModal({
    iconHtml: ic('trash'), danger: true, title: 'למחוק?',
    body: `<b>${esc(name)}</b> יימחק לצמיתות.${extra}`,
    okText: 'מחיקה',
    onOk: () => {
      const list = getList(), i = list.findIndex(x => x.id === id);
      if (i < 0) return;
      list.splice(i, 1);
      if (kind === 'student') purgeStudents([id]);
      save(); render();
      toast(`${esc(name)} נמחק`, 'info');
    }
  });
}
/** Remove students together with everything that belongs to them. */
function purgeStudents(ids) {
  const gone = new Set(ids);
  state.students = state.students.filter(s => !gone.has(s.id));
  state.log = state.log.filter(e => !gone.has(e.studentId));
  state.orders = state.orders.filter(o => !gone.has(o.studentId));
  state.actions = state.actions
    .map(a => ({ ...a, items: a.items.filter(it => !gone.has(it.studentId)) }))
    .filter(a => a.items.length);
  gone.forEach(id => ui.selected.delete(id));
}

/* ==========================================================
   6. Effects: toast, modal, sound, confetti, count-up, level-up
   ========================================================== */
function toast(html, type = 'info', ms = 2800) {
  const box = $('#toasts');
  const el = document.createElement('div');
  const icon = { success: 'check-circle', error: 'alert', warn: 'trend-down', info: 'info' }[type] || 'info';
  el.className = `toast ${type}`;
  el.innerHTML = `${ic(icon, 't-ico')}<span>${html}</span>`;
  box.appendChild(el);
  while (box.children.length > 4) box.firstElementChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 350); }, ms);
}

function shake(el) {
  if (!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 500);
}

// --- Modal (always a <form>: Enter confirms, Esc / backdrop / cancel closes) ---
let modal = null;
function openModal({ iconHtml = '', title, body = '', okText = 'אישור', okClass = '', cancelText = 'ביטול', danger = false, onOk }) {
  closeModal(true);
  const opener = document.activeElement;
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `
    <form class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" novalidate>
      ${iconHtml ? `<div class="m-icon ${danger ? 'danger' : ''}">${iconHtml}</div>` : ''}
      <h2 id="m-title">${esc(title)}</h2>
      <div class="m-body">${body}</div>
      <div class="m-actions">
        <button type="submit" class="btn ${danger ? 'btn-bad' : okClass}" data-m="ok">${esc(okText)}</button>
        <button type="button" class="btn btn-ghost" data-m="cancel">${esc(cancelText)}</button>
      </div>
    </form>`;
  $('#modal-root').appendChild(back);
  const form = $('form', back);
  modal = { back, opener };
  back.addEventListener('mousedown', e => { if (e.target === back) closeModal(); });
  $('[data-m="cancel"]', back).addEventListener('click', () => closeModal());
  form.addEventListener('submit', e => {
    e.preventDefault();
    const keepOpen = onOk && onOk(new FormData(form), form) === false;
    if (!keepOpen) closeModal();
  });
  requestAnimationFrame(() => back.classList.add('open'));
  const first = $('input', form) || $('[data-m="ok"]', form);
  // Autofocus only if the user hasn't already moved into the modal (never steal focus).
  setTimeout(() => { if (first && modal && modal.back === back && !back.contains(document.activeElement)) first.focus(); }, 30);
}
function closeModal(instant) {
  if (!modal) return;
  const { back, opener } = modal;
  modal = null;
  back.classList.remove('open');
  const done = () => back.remove();
  if (instant || reduceMotion.matches) done(); else setTimeout(done, 220);
  if (!instant && opener && opener.isConnected && typeof opener.focus === 'function') opener.focus({ preventScroll: true });
}
function trapFocus(e) {
  if (!modal || e.key !== 'Tab') return;
  const items = $$('button, input, select, [tabindex]:not([tabindex="-1"])', modal.back).filter(x => !x.disabled);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (!modal.back.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
}

// --- Sound (WebAudio, generated tones only; OFF by default) ---
const sound = { on: lsGet(SOUND_KEY) === '1', ctx: null };
function audioCtx() {
  if (!sound.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { sound.ctx = new AC(); } catch (e) { return null; }
  }
  if (sound.ctx.state === 'suspended') sound.ctx.resume().catch(() => {});
  return sound.ctx;
}
function tone(ctx, freq, at, dur, type = 'sine', vol = 0.12, freqEnd) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  const t0 = ctx.currentTime + at;
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function play(name) {
  if (!sound.on) return;
  const ctx = audioCtx();
  if (!ctx) return;
  try {
    if (name === 'coin') { tone(ctx, 988, 0, 0.09, 'triangle', 0.1); tone(ctx, 1319, 0.08, 0.28, 'triangle', 0.1); }
    else if (name === 'buy') { [784, 988, 1175, 1568].forEach((f, i) => tone(ctx, f, i * 0.07, 0.2, 'triangle', 0.11)); }
    else if (name === 'level') { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(ctx, f, i * 0.1, i === 6 ? 0.6 : 0.22, 'triangle', 0.12)); }
    else if (name === 'down') { tone(ctx, 220, 0, 0.2, 'sine', 0.14, 140); }
    else if (name === 'error') { tone(ctx, 200, 0, 0.14, 'sawtooth', 0.04); tone(ctx, 150, 0.12, 0.2, 'sawtooth', 0.04); }
  } catch (e) { /* audio is optional */ }
}
function toggleSound() {
  sound.on = !sound.on;
  lsSet(SOUND_KEY, sound.on ? '1' : '0');
  updateSoundButtons();
  if (sound.on) { audioCtx(); play('coin'); }
  toast(sound.on ? 'הצלילים הופעלו' : 'הצלילים כובו', 'info', 1800);
}
function soundBtn() {

}
function updateSoundButtons() {
  $$('.sound-btn').forEach(b => {

    b.setAttribute('aria-pressed', String(sound.on));

}

// --- Confetti (single canvas, stops itself when idle) ---
const fx = { cv: null, ctx: null, parts: [], raf: 0, w: 0, h: 0 };
const CONFETTI_COLORS = ['#ffc83d', '#ff9f1c', '#7c5cff', '#a78bff', '#37e3a0', '#ff5d7a', '#ffffff'];
function sizeConfetti() {
  if (!fx.cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fx.w = window.innerWidth; fx.h = window.innerHeight;
  fx.cv.width = fx.w * dpr; fx.cv.height = fx.h * dpr;
  fx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function confetti(amount = 120) {
  if (reduceMotion.matches) return;
  if (!fx.cv) {
    fx.cv = $('#confetti');
    fx.ctx = fx.cv.getContext('2d');
    if (!fx.ctx) return;
    sizeConfetti();
  }
  for (let i = 0; i < amount; i++) {
    const fromLeft = i % 2 === 0;
    fx.parts.push({
      x: fromLeft ? -10 : fx.w + 10, y: fx.h * (0.55 + Math.random() * 0.25),
      vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 9), vy: -(9 + Math.random() * 11),
      w: 6 + Math.random() * 6, h: 9 + Math.random() * 8, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.35,
      c: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)], round: Math.random() < 0.25, life: 0
    });
  }
  if (!fx.raf) fx.raf = requestAnimationFrame(confettiTick);
}
function confettiTick() {
  const { ctx } = fx;
  ctx.clearRect(0, 0, fx.w, fx.h);
  fx.parts = fx.parts.filter(p => p.y < fx.h + 30 && p.life < 260);
  for (const p of fx.parts) {
    p.life++; p.vy += 0.32; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
    else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life / 8)) + 2);
    ctx.restore();
  }
  if (fx.parts.length) fx.raf = requestAnimationFrame(confettiTick);
  else { fx.raf = 0; ctx.clearRect(0, 0, fx.w, fx.h); }
}

// --- Count-up for the balance number ---
const counters = new WeakMap();
function countUp(el, from, to, dur = 900) {
  const prev = counters.get(el);
  if (prev) cancelAnimationFrame(prev);
  if (reduceMotion.matches || from === to) { el.textContent = to; return; }
  const start = performance.now();
  const step = now => {
    const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1) counters.set(el, requestAnimationFrame(step)); else counters.delete(el);
  };
  counters.set(el, requestAnimationFrame(step));
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

/* ==========================================================
   7. Charts (hand-drawn inline SVG, mirrored for RTL:
      time runs from right (oldest) to left (today), values axis on the right)
   ========================================================== */
function niceScale(v, ticks = 4) {
  v = Math.max(v, 4);
  const raw = v / ticks, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  return { max: Math.ceil(v / step) * step, step };
}
function chartEmpty(icon, title, msg) {
  return `<div class="chart-empty"><div>${ic(icon)}<b>${esc(title)}</b>${esc(msg)}</div></div>`;
}
function studentLog(id) { return state.log.filter(e => e.studentId === id).sort((a, b) => a.t - b.t); }

/** Shared pointer/keyboard hover logic. getX(i) returns the svg x of item i; show(i) returns {x,y,html}. */
function attachHover(el, svg, count, getX, show, hide) {
  const tt = $('.tt', el);
  let idx = -1;
  const W = svg.viewBox.baseVal.width;
  const localX = e => { const r = svg.getBoundingClientRect(); return (e.clientX - r.left) * (W / r.width); };
  const nearest = x => { let b = 0, bd = Infinity; for (let i = 0; i < count; i++) { const d = Math.abs(getX(i) - x); if (d < bd) { bd = d; b = i; } } return b; };
  const set = i => {
    if (i === idx && tt.classList.contains('show')) return;
    idx = i;
    const { x, y, html } = show(i);
    tt.innerHTML = html;
    const r = svg.getBoundingClientRect(), scale = r.width / W;
    const half = tt.offsetWidth / 2, maxL = el.clientWidth - half - 2;
    tt.style.left = Math.max(half + 2, Math.min(maxL, x * scale)) + 'px';
    tt.style.top = Math.max(tt.offsetHeight + 14, y * scale) + 'px';
    tt.classList.add('show');
  };
  const off = () => { idx = -1; tt.classList.remove('show'); hide(); };
  svg.addEventListener('pointermove', e => set(nearest(localX(e))));
  svg.addEventListener('pointerdown', e => set(nearest(localX(e))));
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') off(); });
  svg.addEventListener('blur', off);
  svg.addEventListener('keydown', e => {
    // RTL: later items are further left, so ArrowLeft moves forward in time.
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const d = e.key === 'ArrowLeft' ? 1 : -1;
      set(idx < 0 ? (d > 0 ? 0 : count - 1) : Math.max(0, Math.min(count - 1, idx + d)));
    } else if (e.key === 'Escape') off();
  });
  el._hideTip = off;
}

function drawBalanceChart(el, s, animate) {
  const days = lastDays(BALANCE_DAYS), from = days[0], now = Date.now();
  const entries = studentLog(s.id);
  let bal = s.coins - entries.reduce((a, e) => a + e.delta, 0); // baseline (0 when history is complete)
  let startBal = Math.max(0, bal);
  const pts = [];
  for (const e of entries) {
    bal += e.delta;
    if (e.t < from) startBal = Math.max(0, bal);
    else pts.push({ t: e.t, bal: Math.max(0, bal), e });
  }
  if (!pts.length) { el.innerHTML = chartEmpty('chart', 'עדיין אין נתונים', 'כשתקבלו מטבעות, הגרף יתחיל לצמוח כאן'); return; }

  const W = Math.max(280, Math.round(el.clientWidth || 600)), H = W < 520 ? 210 : 240;
  const P = { s: 40, e: 30, t: 26, b: 30 };   // s = values-axis side (right), e = far end (left)
  const plotR = W - P.s, plotL = P.e;
  const endBal = pts[pts.length - 1].bal;
  const { max, step } = niceScale(Math.max(startBal, ...pts.map(p => p.bal)) * 1.15);
  const X = t => plotR - (t - from) / (now - from) * (plotR - plotL);
  const Y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  const line = [[from, startBal], ...pts.map(p => [p.t, p.bal]), [now, endBal]];
  const d = line.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
  const area = `${d}L${X(now).toFixed(1)},${Y(0)}L${X(from).toFixed(1)},${Y(0)}Z`;

  let grid = `<text class="cap" x="${W - 2}" y="12" text-anchor="end">מטבעות</text>`;
  for (let v = 0; v <= max + 1e-9; v += step) {
    grid += `<line class="gridl" x1="${plotL}" x2="${plotR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${plotR + 8}" y="${Y(v) + 4}" text-anchor="start">${v}</text>`;
  }
  const every = Math.max(1, Math.ceil(52 / ((plotR - plotL) / BALANCE_DAYS)));
  let xl = '';
  for (let i = days.length - 1; i >= 0; i -= every) {
    const x = X(days[i]);
    xl += `<line class="gridl" x1="${x}" x2="${x}" y1="${H - P.b}" y2="${H - P.b + 5}"/><text x="${x}" y="${H - P.b + 18}" text-anchor="middle">${i === days.length - 1 ? 'היום' : dayLabel(days[i])}</text>`;
  }
  const dots = pts.length <= 80 ? pts.map(p => `<circle class="bal-dot" cx="${X(p.t).toFixed(1)}" cy="${Y(p.bal).toFixed(1)}" r="3.2"/>`).join('') : '';
  const lx = X(now), ly = Y(endBal);

  el.innerHTML = `
    <svg class="${animate ? 'enter' : ''}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="img"
      aria-label="גרף יתרה ב-14 הימים האחרונים: מ-${startBal} ל-${endBal} מטבעות. אפשר לעבור בין נקודות עם החצים.">
      <defs><linearGradient id="gBal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffc83d" stop-opacity=".5"/><stop offset="1" stop-color="#7c5cff" stop-opacity=".04"/>
      </linearGradient></defs>
      <g class="ax">${grid}${xl}</g>
      <line class="axis-base" x1="${plotL}" x2="${plotR}" y1="${Y(0)}" y2="${Y(0)}"/>
      <path class="bal-area" d="${area}" fill="url(#gBal)"/>
      <path class="bal-line" d="${d}" pathLength="1"/>
      ${dots}
      <g class="last-g"><circle class="last-ring" cx="${lx}" cy="${ly}" r="12"/><circle class="last-dot" cx="${lx}" cy="${ly}" r="6"/>
        <text class="last-val" x="${lx}" y="${ly - 17}" text-anchor="middle">${endBal}</text></g>
      <g class="hov" style="display:none"><line class="cross" y1="${P.t}" y2="${H - P.b}"/><circle class="hl" r="6"/></g>
    </svg><div class="tt" aria-hidden="true"></div>`;
  const svg = $('svg', el), hov = $('.hov', svg), cross = $('.cross', hov), hl = $('.hl', hov);
  attachHover(el, svg, pts.length, i => X(pts[i].t), i => {
    const p = pts[i], x = X(p.t), y = Y(p.bal);
    hov.style.display = '';
    cross.setAttribute('x1', x); cross.setAttribute('x2', x);
    hl.setAttribute('cx', x); hl.setAttribute('cy', y);
    const cls = p.e.delta > 0 ? 'tp' : p.e.delta < 0 ? 'tn' : '';
    return { x, y, html: `<strong>${esc(fmtWhen(p.t))}</strong><div>${esc(p.e.text)} <span class="num ${cls}">${signed(p.e.delta)}</span></div><div>יתרה: <span class="tg">${p.bal}</span> מטבעות</div>` };
  }, () => { hov.style.display = 'none'; });
}

function drawBarChart(el, s, animate) {
  const days = lastDays(BAR_DAYS);
  const index = new Map(days.map((d, i) => [d, i]));
  const agg = days.map(d => ({ d, earned: 0, lost: 0, spent: 0 }));
  let any = false;
  for (const e of state.log) {
    if (e.studentId !== s.id) continue;
    const i = index.get(dayStart(e.t));
    if (i === undefined) continue;
    any = true;
    if (e.delta > 0) agg[i].earned += e.delta;
    else if (e.kind === 'buy') agg[i].spent -= e.delta;
    else agg[i].lost -= e.delta;
  }
  if (!any) { el.innerHTML = chartEmpty('bars', 'שבוע ריק בינתיים', 'כאן יופיעו המטבעות שקיבלתם ואיבדתם בכל יום'); return; }

  const W = Math.max(280, Math.round(el.clientWidth || 600)), H = W < 520 ? 210 : 240;
  const P = { s: 34, e: 10, t: 22, b: 42 };
  const plotR = W - P.s, plotL = P.e;
  const { max, step } = niceScale(Math.max(...agg.map(a => Math.max(a.earned, a.lost))) * 1.1);
  const gw = (plotR - plotL) / BAR_DAYS;
  const bw = Math.max(6, Math.min(22, gw * 0.3));
  const Y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  const cx = i => plotR - gw * (i + 0.5);
  let grid = `<text class="cap" x="${W - 2}" y="10" text-anchor="end">מטבעות</text>`;
  for (let v = 0; v <= max + 1e-9; v += step) {
    grid += `<line class="gridl" x1="${plotL}" x2="${plotR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${plotR + 7}" y="${Y(v) + 4}" text-anchor="start">${v}</text>`;
  }
  let xl = '', bars = '';
  agg.forEach((a, i) => {
    const isToday = i === days.length - 1;
    xl += `<text x="${cx(i)}" y="${H - P.b + 17}" text-anchor="middle">${isToday ? 'היום' : 'יום ' + WEEKDAYS[new Date(a.d).getDay()]}</text>`
        + `<text x="${cx(i)}" y="${H - P.b + 31}" text-anchor="middle" style="font-size:10px;opacity:.75">${dayLabel(a.d)}</text>`;
    const base = Y(0);
    // RTL: "earned" sits on the right of each pair, "lost" on the left (same order as the legend).
    if (a.earned) bars += `<rect class="bar bar-pos" style="--i:${i}" x="${(cx(i) + 1).toFixed(1)}" y="${Y(a.earned).toFixed(1)}" width="${bw.toFixed(1)}" height="${(base - Y(a.earned)).toFixed(1)}" rx="4"/>`;
    if (a.lost) bars += `<rect class="bar bar-neg" style="--i:${i}" x="${(cx(i) - bw - 1).toFixed(1)}" y="${Y(a.lost).toFixed(1)}" width="${bw.toFixed(1)}" height="${(base - Y(a.lost)).toFixed(1)}" rx="4"/>`;
  });
  const totE = agg.reduce((x, a) => x + a.earned, 0), totL = agg.reduce((x, a) => x + a.lost, 0);
  el.innerHTML = `
    <svg class="${animate ? 'enter' : ''}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="img"
      aria-label="גרף עמודות לשבוע האחרון: ${totE} מטבעות נצברו ו-${totL} ירדו. אפשר לעבור בין ימים עם החצים.">
      <rect class="bar-hover" x="0" y="${P.t}" width="${gw.toFixed(1)}" height="${H - P.t - P.b}" rx="8" style="display:none"/>
      <g class="ax">${grid}${xl}</g>
      <line class="axis-base" x1="${plotL}" x2="${plotR}" y1="${Y(0)}" y2="${Y(0)}"/>
      ${bars}
    </svg><div class="tt" aria-hidden="true"></div>`;
  const svg = $('svg', el), hb = $('.bar-hover', svg);
  attachHover(el, svg, BAR_DAYS, cx, i => {
    const a = agg[i];
    hb.style.display = ''; hb.setAttribute('x', (plotR - gw * (i + 1)).toFixed(1));
    const html = `<strong>${esc(fmtDay(a.d))}</strong>`
      + `<div>קיבלתי: <span class="num tp">${signed(a.earned)}</span></div>`
      + `<div>איבדתי: <span class="num tn">${signed(-a.lost)}</span></div>`
      + (a.spent ? `<div>קניות בחנות: <span class="tg">${a.spent}</span></div>` : '');
    return { x: cx(i), y: Y(Math.max(a.earned, a.lost)), html };
  }, () => { hb.style.display = 'none'; });
}

function openCreatePassword(s) {

  openModal({
    iconHtml: avatar(s, 'xl'),
    title: `שלום ${s.name}! יצירת סיסמה`,
    body: `<p>זו הכניסה הראשונה שלך. בחרו סיסמה של ${MIN_PASSWORD} תווים לפחות – רק מי שיודע אותה יוכל להיכנס לחשבון.</p>
      <label class="m-field" for="pw1">סיסמה חדשה<input id="pw1" name="pw1" class="pin-input" type="password" maxlength="32" autocomplete="new-password"></label>
      <label class="m-field" for="pw2">הקלידו שוב את הסיסמה<input id="pw2" name="pw2" class="pin-input" type="password" maxlength="32" autocomplete="new-password"></label>`,
    okText: 'שמירה וכניסה', okClass: 'btn-gold',

      const cur = studentById(id);
      if (!cur) return true;
      const p1 = String(fd.get('pw1') || ''), p2 = String(fd.get('pw2') || '');
      const fail = (msg, field) => { toast(msg, 'error'); play('error'); shake(form); if (field) field.focus(); return false; };
      if (p1.length < MIN_PASSWORD) return fail(`הסיסמה צריכה להכיל לפחות ${MIN_PASSWORD} תווים`, $('#pw1', form));
      if (!p2) { $('#pw2', form).focus(); return false; }   // Enter in the first field moves on
      if (p1 !== p2) { $('#pw2', form).value = ''; return fail('הסיסמאות לא תואמות, נסו שוב', $('#pw2', form)); }
      cur.pin = hashPin(cur.id, p1);
      save();
      toast('הסיסמה נשמרה. ברוכים הבאים!', 'success');
      setTimeout(() => enterStudent(id), 0);
      return true;
    }

}
function openEnterPassword(s) {
  const id = s.id;
  openModal({
    iconHtml: avatar(s, 'xl'),
    title: `שלום ${s.name}`,
    body: `<label class="m-field" for="pw">הזינו את הסיסמה שלכם<input id="pw" name="pw" class="pin-input" type="password" maxlength="32" autocomplete="current-password"></label>

function renderHero(s) {
  const balEl = $('#bal');
  if (ui.shownBalance !== s.coins) { countUp(balEl, ui.shownBalance, s.coins); ui.shownBalance = s.coins; }
  else balEl.textContent = s.coins;

  const li = levelIndex(s.totalEarned);
  const maxed = li === LEVELS.length - 1;
  const into = s.totalEarned - li * COINS_PER_LEVEL;
  const pct = maxed ? 100 : Math.round(into / COINS_PER_LEVEL * 100);
  $('#lvl-hex').innerHTML = hexBadge(li + 1, 56);
  $('#lvl-name').textContent = `רמה ${li + 1} · ${LEVELS[li]}`;
  const xp = $('#xp');
  xp.setAttribute('aria-valuenow', pct);
  $('i', xp).style.width = pct + '%';
  $('#xp-text').textContent = maxed
    ? 'הגעת לרמה הגבוהה ביותר!'
    : `עוד ${COINS_PER_LEVEL - into} מטבעות לרמה ${li + 2} · ${LEVELS[li + 1]}`;
  const bought = state.orders.filter(o => o.studentId === s.id).length;
  $('#stats').innerHTML = `<span class="stat">נצברו בסך הכל: <b>${s.totalEarned}</b></span><span class="stat">פרסים שקניתי: <b>${bought}</b></span>`;
}

function renderShop(s) {
  const el = $('#shop');
  if (!state.rewards.length) { el.innerHTML = `<div class="empty" style="grid-column:1/-1">${ic('bag')}אין עדיין פרסים בחנות</div>`; return; }
  el.innerHTML = state.rewards.map(r => {
    const can = s.coins >= r.cost, pct = Math.min(100, Math.round(s.coins / r.cost * 100));
    return `<article class="reward ${can ? 'can' : ''}">
      ${giftIc()}
      <div class="r-name">${esc(r.label)}</div>
      <div class="r-cost">${coinIc()}<span>${r.cost}</span><span class="sr-only">מטבעות</span></div>

        aria-label="${can ? `קנה ${esc(r.label)} ב-${r.cost} מטבעות` : `חסרים עוד ${r.cost - s.coins} מטבעות ל${esc(r.label)}`}">

  }).join('');

function feedItem(e, i, anim, timeOnly) {
  const cls = e.kind === 'buy' ? 'buy' : e.delta > 0 ? 'pos' : e.delta < 0 ? 'neg' : 'zero';
  return `<li class="feed-item ${cls}${anim ? ' anim' : ''}" style="--i:${Math.min(i, 12)}">
    <div class="f-main"><div class="f-text">${esc(e.text)}</div>
      ${e.note ? `<div class="f-note">${ic('note')}<span>${esc(e.note)}</span></div>` : ''}

    <div class="f-amt num">${signed(e.delta)}</div></li>`;
}

function renderFeed(s) {
  const wrap = $('#feed-wrap');
  const items = state.log.filter(e => e.studentId === s.id).sort((a, b) => b.t - a.t);
  if (!items.length) { wrap.innerHTML = `<div class="empty">${ic('sprout')}עדיין אין אירועים. כל התנהגות טובה מביאה מטבעות!</div>`; ui.feedSeen = 0; return; }
  const fresh = Math.max(0, items.length - ui.feedSeen); // newest N haven't been animated yet
  const firstRender = ui.feedSeen === 0;
  const shown = items.slice(0, FEED_PREVIEW);
  wrap.innerHTML = `<ol class="feed" aria-label="פעילות אחרונה">${shown.map((e, i) => feedItem(e, i, firstRender ? i < 12 : i < fresh)).join('')}</ol>
    <button type="button" class="btn btn-ghost more-btn" data-action="open-activity">${ic('list')} לכל הפעילות (${items.length})</button>`;

function renderActivity() {
  const s = studentById(ui.studentId);
  const key = 'activity:' + s.id;
  if (ui.built !== key) {
    ui.built = key;
    app.innerHTML = `
      <div class="screen">
        ${studentTopbar(s, 'על מה קיבלתי מטבעות', `כל הפעילות של ${esc(s.name)}`,

        <section class="card" aria-label="כל הפעילות">
          <div class="act-summary" id="act-summary"></div>
          <div class="chips" role="group" aria-label="סינון פעילות" id="chips"></div>
          <div id="act-list"></div>
        </section>
      </div>`;
  }
  const all = state.log.filter(e => e.studentId === s.id).sort((a, b) => b.t - a.t);
  const gain = all.filter(e => e.delta > 0), loss = all.filter(e => e.delta < 0);
  const sum = arr => arr.reduce((x, e) => x + e.delta, 0);
  $('#act-summary').innerHTML = `<span class="stat">אירועים: <b>${all.length}</b></span>
    <span class="stat">קיבלתי: <b class="num" style="color:var(--goodTxt)">${signed(sum(gain))}</b></span>
    <span class="stat">איבדתי: <b class="num" style="color:var(--badTxt)">${signed(sum(loss))}</b></span>`;
  const chip = (f, label, n) => `<button type="button" class="chip" data-action="filter" data-filter="${f}" aria-pressed="${ui.filter === f}">${label}<span class="n">(${n})</span></button>`;
  $('#chips').innerHTML = chip('all', 'הכול', all.length) + chip('gain', 'קיבלתי', gain.length) + chip('loss', 'איבדתי', loss.length);

  const list = ui.filter === 'gain' ? gain : ui.filter === 'loss' ? loss : all;
  const wrap = $('#act-list');
  if (!list.length) {
    const msg = ui.filter === 'gain' ? 'עדיין אין מטבעות שהתקבלו' : ui.filter === 'loss' ? 'לא איבדת מטבעות – כל הכבוד!' : 'עדיין אין אירועים';
    wrap.innerHTML = `<div class="empty">${ic('sprout')}${msg}</div>`;
  } else {
    const groups = [];
    for (const e of list) {
      const ds = dayStart(e.t);
      if (!groups.length || groups[groups.length - 1].ds !== ds) groups.push({ ds, items: [] });
      groups[groups.length - 1].items.push(e);
    }
    let n = 0;
    wrap.innerHTML = groups.map(g => `<section class="day-group">
      <h3 class="day-h">${esc(fmtDay(g.ds))} <span class="cnt">${g.items.length === 1 ? 'אירוע אחד' : g.items.length + ' אירועים'}</span></h3>
      <ol class="feed">${g.items.map(e => { const i = n++; return feedItem(e, i, i < 12, true); }).join('')}</ol></section>`).join('');
  }
  checkLevelUp(s);
}

      </section>
      <div class="col">
        <section class="card" aria-label="התנהגויות">
          <label class="note-field"><span>${ic('note')} הערה לתלמיד (לא חובה – תוצג לו בפעילות)</span>
            <input id="note" maxlength="120" autocomplete="off" placeholder="למשל: עזרת לחבר בתרגיל 4" value="${esc(ui.note)}" class="${ui.note ? 'has' : ''}"></label>
          <h2 class="grp pos">${ic('up')} התנהגות חיובית</h2><div class="beh-grid" id="beh-pos"></div>
          <h2 class="grp neg">${ic('down')} התנהגות שלילית</h2><div class="beh-grid" id="beh-neg"></div>
        </section>
        <section class="card" aria-labelledby="recent-h">
          <div class="card-title"><h2 id="recent-h">${ic('list')} 5 הפעולות האחרונות</h2>
            <button type="button" class="btn btn-ghost btn-small" data-action="undo" id="undo-btn">${ic('undo')} ביטול הפעולה האחרונה</button></div>
          <ol class="recent-list" id="recent"></ol>
        </section>
      </div>
    </div>`;
  if (tab === 'orders') return `
    <section class="card" aria-labelledby="orders-h">
      <div class="card-title"><h2 id="orders-h">${ic('bag')} פרסים שנרכשו</h2><span class="sub" id="orders-sub"></span></div>
      <div id="orders-wrap"></div>
    </section>`;
  const cl = classById(ui.classId);
  return `
    <div class="edit-grid">
      <section class="card" aria-labelledby="ed-c-h">
        <div class="card-title"><h2 id="ed-c-h">${ic('users')} כיתות</h2><span class="sub">הוספה, שינוי שם ומחיקה</span></div>
        <form class="add-form" data-form="class" autocomplete="off">
          <label class="field"><span>שם כיתה חדשה</span><input name="name" required maxlength="20" placeholder="למשל: ח'1"></label>
          <button type="submit" class="btn btn-gold">${ic('plus')} הוספת כיתה</button>
        </form>
        <ul class="ed-list" id="ed-classes"></ul>
      </section>
      <section class="card" aria-labelledby="ed-s-h">
        <div class="card-title"><h2 id="ed-s-h">${ic('users')} תלמידי כיתה ${esc(cl.name)}</h2></div>
        <form class="add-form" data-form="student" autocomplete="off">
          <div class="field-row">
            <label class="field"><span>שם</span><input name="name" required maxlength="20" placeholder="שם התלמיד/ה"></label>
            <label class="field"><span>מטבעות פתיחה</span><input name="coins" type="number" inputmode="numeric" min="0" max="999" value="0"></label>
          </div>
          <button type="submit" class="btn btn-gold">${ic('plus')} הוספת תלמיד</button>
        </form>
        <ul class="ed-list" id="ed-students"></ul>
      </section>
      <section class="card" aria-labelledby="ed-b-h">
        <div class="card-title"><h2 id="ed-b-h">${ic('target')} התנהגויות</h2></div>
        <form class="add-form" data-form="behavior" autocomplete="off">
          <div class="field-row r3">
            <label class="field"><span>תיאור</span><input name="label" required maxlength="30" placeholder="למשל: סידור הכיתה"></label>
            <label class="field"><span>סוג</span><select name="sign"><option value="pos">חיובי (+)</option><option value="neg">שלילי (−)</option></select></label>
            <label class="field"><span>מטבעות</span><input name="amount" type="number" inputmode="numeric" min="1" max="100" value="5" required></label>
          </div>
          <button type="submit" class="btn btn-gold">${ic('plus')} הוספת התנהגות</button>
        </form>
        <ul class="ed-list" id="ed-behaviors"></ul>
      </section>
      <section class="card" aria-labelledby="ed-r-h">
        <div class="card-title"><h2 id="ed-r-h">${ic('bag')} פרסים</h2></div>
        <form class="add-form" data-form="reward" autocomplete="off">
          <div class="field-row">
            <label class="field"><span>שם הפרס</span><input name="label" required maxlength="30" placeholder="למשל: 10 דקות משחק"></label>
            <label class="field"><span>מחיר</span><input name="cost" type="number" inputmode="numeric" min="1" max="9999" value="25" required></label>
          </div>
          <button type="submit" class="btn btn-gold">${ic('plus')} הוספת פרס</button>
        </form>
        <ul class="ed-list" id="ed-rewards"></ul>
      </section>
      <section class="card" aria-labelledby="ed-set-h">
        <div class="card-title"><h2 id="ed-set-h">${ic('gear')} הגדרות</h2></div>
        <label class="switch-row"><input type="checkbox" id="set-board"><span class="switch" aria-hidden="true"></span>
          <span>הצג לוח מובילים</span></label>
        <div class="tool-box" id="demo-box">
          <h3>${ic('spark')} עזר להצגה</h3>
          <p id="demo-info"></p>
          <button type="button" class="btn" data-action="random-event">${ic('spark')} אירוע אקראי</button>
        </div>
        <div class="danger">
          <h3>${ic('alert')} איפוס נתונים</h3>
          <p>מחיקת כל הנתונים וחזרה לנתוני ההדגמה ההתחלתיים.</p>
          <button type="button" class="btn btn-bad" data-action="reset">${ic('trash')} איפוס כל הנתונים</button>
        </div>
      </section>
    </div>`;
}

function renderRoster() {
  const list = classStudents(ui.classId);
  const all = list.length > 0 && list.every(s => ui.selected.has(s.id));
  const selAll = $('#sel-all');
  selAll.innerHTML = all ? `${ic('check')} ניקוי בחירה` : `${ic('check')} בחר הכל`;
  selAll.setAttribute('aria-pressed', String(all));
  selAll.disabled = !list.length;
  $('#sel-info').textContent = list.length
    ? (ui.selected.size ? `נבחרו ${ui.selected.size} מתוך ${list.length}` : 'לא נבחרו תלמידים')
    : 'אין תלמידים בכיתה – אפשר להוסיף בלשונית עריכה';
  $('#roster').innerHTML = list.map(s => {
    const on = ui.selected.has(s.id);
    return `<li><button type="button" class="stu-row" data-action="toggle" data-id="${s.id}" aria-pressed="${on}">
      <span class="ck" aria-hidden="true">${ic('check')}</span>${avatar(s, 'sm')}
      <span class="nm">${esc(s.name)}</span><span class="cn">${coinIc()}${s.coins}</span></button></li>`;
  }).join('');
}

function renderBehaviors() {
  const btn = b => `<button type="button" class="beh ${b.coins > 0 ? 'p' : 'n'}" data-action="behavior" data-id="${b.id}"
      aria-label="${esc(b.label)}, ${b.coins > 0 ? 'פלוס' : 'מינוס'} ${Math.abs(b.coins)} מטבעות">
      <span class="bc num">${signed(b.coins)}</span><span class="bl">${esc(b.label)}</span></button>`;
  const pos = state.behaviors.filter(b => b.coins > 0), neg = state.behaviors.filter(b => b.coins < 0);
  const none = `<div class="empty" style="grid-column:1/-1">אין התנהגויות – אפשר להוסיף בלשונית עריכה</div>`;
  $('#beh-pos').innerHTML = pos.length ? pos.map(btn).join('') : none;
  $('#beh-neg').innerHTML = neg.length ? neg.map(btn).join('') : none;
}

function renderRecent() {
  const last = classActions().slice(-5).reverse();
  $('#undo-btn').disabled = !last.length;
  $('#recent').innerHTML = last.length ? last.map(a => {
    const names = a.items.map(it => studentById(it.studentId)).filter(Boolean).map(s => s.name);
    const who = names.length <= 2 ? names.join(', ') : `${names.slice(0, 2).join(', ')} ועוד ${names.length - 2}`;
    return `<li><span class="ra num ${a.coins > 0 ? 'p' : 'n'}">${signed(a.coins)}</span><span class="rl">${esc(a.label)}${a.random ? ' (אקראי)' : ''}</span>
      <span class="rw">${esc(who || 'תלמידים שנמחקו')}${a.note ? ' · עם הערה' : ''}</span><time>${esc(hhmm(a.t))}</time></li>`;
  }).join('') : '<li class="muted" style="justify-content:center">עדיין לא בוצעו פעולות</li>';
}

function renderOrders() {
  const mine = classOrders();
  const pending = mine.filter(o => !o.done).sort((a, b) => b.t - a.t);
  const done = mine.filter(o => o.done).sort((a, b) => b.t - a.t);
  $('#orders-sub').textContent = `${pending.length} ממתינים · ${done.length} נמסרו`;
  const row = o => {
    const s = studentById(o.studentId);
    return `<li class="order ${o.done ? 'done' : 'pending'}">
      ${giftIc('og')}
      <div class="om"><div class="ot">${esc(o.reward)}</div>
        <div class="os">${s ? esc(s.name) : 'תלמיד שנמחק'} · ${esc(fmtWhen(o.t))}</div></div>
      ${o.done ? `<span class="done-tag">${ic('check-circle')} נמסר</span>`
        : `<button type="button" class="btn btn-good btn-small" data-action="deliver" data-id="${o.id}">${ic('check')} סימון כנמסר</button>`}</li>`;
  };
  $('#orders-wrap').innerHTML = mine.length
    ? `<ul class="orders">${pending.map(row).join('')}${done.map(row).join('')}</ul>`
    : `<div class="empty">${ic('bag')}עדיין לא נרכשו פרסים</div>`;
}

function renderEditLists() {
  const del = (kind, id, name) => `<button type="button" class="del" data-action="delete" data-kind="${kind}" data-id="${id}" aria-label="מחיקת ${esc(name)}">${ic('trash')}</button>`;
  const empty = '<li class="muted" style="justify-content:center">הרשימה ריקה</li>';
  $('#ed-students').innerHTML = classStudents(ui.classId).map(s => `<li>${avatar(s, 'sm')}<span class="en">${esc(s.name)}</span>
      <span class="ev num g">${s.coins}${coinIc()}</span>${del('student', s.id, s.name)}
      <div class="ed-sub">
        <span class="pw-tag ${s.pin ? 'set' : 'unset'}">${ic(s.pin ? 'lock' : 'key')}${s.pin ? 'סיסמה מוגדרת' : 'ללא סיסמה'}</span>
        <button type="button" class="btn btn-ghost btn-small" data-action="reset-pin" data-id="${s.id}" ${s.pin ? '' : 'disabled'}
          aria-label="איפוס הסיסמה של ${esc(s.name)}">${ic('key')} אפס סיסמה</button>
        ${state.classes.length > 1 ? `<label class="move">כיתה <select class="mini-select" data-move="${s.id}" aria-label="העברת ${esc(s.name)} לכיתה אחרת">${sortedClasses().map(c => `<option value="${c.id}"${c.id === s.classId ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>` : ''}
      </div></li>`).join('') || empty;
  $('#ed-classes').innerHTML = sortedClasses().map(c => `<li><span class="en">${esc(c.name)}${c.id === ui.classId ? ' <span class="pw-tag set">הכיתה הנוכחית</span>' : ''}</span>
      <span class="ev muted">${countText(classStudents(c.id).length)}</span>
      <button type="button" class="edit-btn" data-action="rename-class" data-id="${c.id}" aria-label="שינוי שם הכיתה ${esc(c.name)}">${ic('pencil')}</button>${del('class', c.id, c.name)}</li>`).join('') || empty;
  $('#ed-behaviors').innerHTML = state.behaviors.map(b => `<li><span class="en">${esc(b.label)}</span>
      <span class="ev num ${b.coins > 0 ? 'p' : 'n'}">${signed(b.coins)}</span>${del('behavior', b.id, b.label)}</li>`).join('') || empty;
  $('#ed-rewards').innerHTML = state.rewards.map(r => `<li>${giftIc('coin-ic')}<span class="en">${esc(r.label)}</span>
      <span class="ev num g">${r.cost}${coinIc()}</span>${del('reward', r.id, r.label)}</li>`).join('') || empty;
  $('#set-board').checked = !!state.settings.leaderboard;
  const n = ui.selected.size;
  $('#demo-info').textContent = n
    ? `כל לחיצה מוסיפה אירוע חיובי אקראי ל-${n} התלמידים שנבחרו בלשונית פעולות.`
    : 'בחרו קודם תלמידים בלשונית פעולות. כל לחיצה תוסיף להם אירוע חיובי אקראי – מצוין להדגמה חיה.';
}

/* ==========================================================
   9. Events & boot
   ========================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const id = Number(el.dataset.id);
  switch (el.dataset.action) {
    case 'login': startStudentLogin(id); break;
    case 'logout': {
      const st = studentById(ui.studentId);
      if ((ui.screen === 'student' || ui.screen === 'activity') && st) go('login-class', { loginClassId: st.classId, studentId: null });
      else go('login');
      break;
    }
    case 'pick-class': pickClass(id); break;
    case 'change-class': go(ui.screen === 'login-class' ? 'login' : 'teacher-class'); break;
    case 'add-class': openAddClass(); break;
    case 'rename-class': openRenameClass(id); break;
    case 'teacher-login': openTeacherLogin(); break;
    case 'sound': toggleSound(); break;
    case 'buy': buyReward(id); break;
    case 'open-activity': go('activity', { filter: 'all' }); break;
    case 'back-dash': go('student', { feedSeen: 0 }); break;
    case 'filter': ui.filter = el.dataset.filter; render(); break;
    case 'tab': if (ui.tab !== el.dataset.tab) { ui.tab = el.dataset.tab; render(); $(`#tab-${ui.tab}`).focus(); } break;
    case 'toggle': ui.selected.has(id) ? ui.selected.delete(id) : ui.selected.add(id); render(); break;
    case 'select-all': {
      const list = classStudents(ui.classId);
      if (list.length && list.every(s => ui.selected.has(s.id))) ui.selected.clear();
      else list.forEach(s => ui.selected.add(s.id));
      render(); break;
    }
    case 'behavior': awardBehavior(id); break;
    case 'undo': undoLast(); break;
    case 'random-event': randomEvent(); break;
    case 'deliver': markDelivered(id); break;
    case 'delete': if (el.dataset.kind === 'class') deleteClass(id); else deleteItem(el.dataset.kind, id); break;
    case 'reset-pin': resetPassword(id); break;
    case 'reset': resetAll(); break;
  }
});

document.addEventListener('submit', e => {
  const form = e.target, kind = form.dataset.form;
  if (!kind) return;
  e.preventDefault();
  const fd = new FormData(form);
  const ok = kind === 'student' ? addStudent(fd) : kind === 'behavior' ? addBehavior(fd) : kind === 'class' ? createClass(fd.get('name')) : addReward(fd);
  if (ok) {
    form.reset();
    if (form.elements.name) form.elements.name.focus(); else if (form.elements.label) form.elements.label.focus();
  } else play('error');
});

document.addEventListener('input', e => {
  if (e.target.id === 'class-search') { ui.classQuery = e.target.value; updateClassGrid(); return; }
  if (e.target.id === 'note') { ui.note = e.target.value; e.target.classList.toggle('has', !!e.target.value.trim()); }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.move) { moveStudent(Number(e.target.dataset.move), Number(e.target.value)); return; }
  if (e.target.id === 'set-board') setLeaderboard(e.target.checked);
});

document.addEventListener('keydown', e => {
  // Class search: Enter opens the first match, Esc clears the text.
  if (e.target && e.target.id === 'class-search' && !modal) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const first = classMatches(ui.classQuery)[0];
      if (first) pickClass(first.id); else { toast('לא נמצאה כיתה', 'error'); play('error'); shake(e.target.parentElement); }
      return;
    }
    if (e.key === 'Escape' && e.target.value) {
      e.preventDefault();
      e.target.value = ''; ui.classQuery = ''; updateClassGrid();
      return;
    }
  }
  if (e.key === 'Escape') {
    if ($('.levelup')) { $('.levelup').click(); return; }
    if (modal) { e.preventDefault(); closeModal(); }
  }
  trapFocus(e);
});

// Tap outside a chart hides its tooltip (touch devices).
document.addEventListener('pointerdown', e => {
  $$('.chart').forEach(c => { if (!c.contains(e.target) && c._hideTip) c._hideTip(); });
});

// Redraw charts at the real width after resizing (keeps text crisp & readable).
let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    sizeConfetti();
    if (ui.screen === 'student' && studentById(ui.studentId)) renderCharts(studentById(ui.studentId));
  }, 150);
});

// Keep a second open tab (e.g. teacher laptop + student screen) in sync.
window.addEventListener('storage', e => {
  if (e.key === SOUND_KEY) { sound.on = e.newValue === '1'; updateSoundButtons(); return; }
  if (e.key === SEEN_LEVEL_KEY) { seenLevelsMem = null; return; }
  if (e.key !== STORE_KEY || !e.newValue) return;
  try {
    const next = normalize(JSON.parse(e.newValue));
    if (!next) return;
    state = next;
    if ((ui.screen === 'student' || ui.screen === 'activity') && !studentById(ui.studentId)) { ui.screen = 'login'; toast('התלמיד/ה הוסר/ה מהכיתה', 'info'); }
    render();
  } catch (err) { /* ignore malformed external writes */ }
});

render();
</script>
